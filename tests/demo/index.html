<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--p1:#4f46e5;--p2:#7c3aed;--hot:#f97316;--hot2:#ef4444;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.top{background:linear-gradient(110deg,#312e81,#6d28d9 55%,#db2777);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0003}
.brand{font-weight:800;letter-spacing:.2px;font-size:15px;line-height:1.15}.brand small{display:block;font-weight:500;opacity:.85;font-size:11px}
.ttl{flex:1;font-size:13px;opacity:.95;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{background:#0f172a99;border:1px solid #ffffff55;border-radius:10px;padding:5px 12px;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;min-width:84px;text-align:center}
.timer.low{background:var(--hot2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.wrap{max-width:1120px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px #0f172a14,0 8px 24px #0f172a0a;padding:18px}
/* start */
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#db2777);color:#fff;border-radius:20px;padding:26px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:#ffffff1f}
.hero h1{margin:6px 0 8px;font-size:clamp(24px,5vw,38px);line-height:1.15}
.pill{display:inline-block;background:#fde047;color:#422006;font-weight:800;font-size:12px;border-radius:999px;padding:4px 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:#ffffff26;border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;opacity:.9}
.rules{margin:14px 0 0;padding-left:18px;color:#334155;font-size:14px}.rules li{margin:5px 0}
.inp{width:100%;font:inherit;padding:13px 14px;border:2px solid var(--line);border-radius:12px;margin:8px 0 12px;font-size:16px}.inp:focus{outline:none;border-color:var(--p1)}
.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--hot),var(--hot2));box-shadow:0 6px 16px #ef444455}
.btn.alt{background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 6px 16px #4f46e555}
.btn.ghost{background:#fff;color:var(--p1);border:2px solid var(--p1);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:14px;box-shadow:none}
.btn:active{transform:translateY(1px)}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;color:#334155}
.tab.on{background:var(--p1);border-color:var(--p1);color:#fff}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:10px}
.qn{background:var(--p1);color:#fff;border-radius:8px;padding:3px 11px;font-weight:800;font-size:14px}
.tag{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#eef2ff;color:#4338ca}.tag.E{background:#dcfce7;color:#166534}.tag.M{background:#fef9c3;color:#854d0e}.tag.H{background:#fee2e2;color:#991b1b}
.mk{margin-left:auto;font-weight:700;color:#334155}.mk i{font-style:normal;color:var(--ok)}.mk u{text-decoration:none;color:var(--bad)}
.qt{font-size:17px;line-height:1.6;margin:6px 0 10px}
.fig{background:linear-gradient(#fff,#f8fafc);border:1px solid var(--line);border-radius:14px;padding:8px;margin:8px 0 14px;text-align:center}
.fig svg{width:100%;max-width:470px;height:auto;display:inline-block}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.45;color:var(--ink);transition:.12s}
.opt:hover{border-color:#a5b4fc;background:#f5f3ff}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;font-weight:800;font-size:13px;color:#475569}
.opt.sel{border-color:var(--p1);background:#eef2ff;box-shadow:0 0 0 3px #4f46e522}.opt.sel .k{background:var(--p1);border-color:var(--p1);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.bar .sp{flex:1}
.pal{position:sticky;top:64px}
.pal h3{margin:0 0 4px;font-size:15px}.cand{font-size:12px;color:var(--mut);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:46vh;overflow:auto;padding:2px}
.pb{height:40px;border:0;border-radius:8px;font-weight:800;font-size:14px;background:#e2e8f0;color:#334155;position:relative}
.pb.s1{background:#ef4444;color:#fff;border-radius:8px 8px 18px 18px}.pb.s2{background:#22c55e;color:#fff;border-radius:18px 18px 8px 8px}.pb.s3{background:#8b5cf6;color:#fff;border-radius:50%}.pb.s4{background:#8b5cf6;color:#fff;border-radius:50%}
.pb.s4:after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.pb.cur{outline:3px solid var(--hot);outline-offset:1px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;color:#475569;margin:10px 0}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.palbtn{display:none}
/* modal */
.modal{position:fixed;inset:0;background:#0f172a99;display:none;place-items:center;z-index:50;padding:16px}.modal.on{display:grid}
.mbox{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%}.mbox h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* result */
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e2e8f0 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}.ring b{font-size:30px;line-height:1}.ring span{font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--mut)}
.subrow{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:14px;font-weight:700}
.meter{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}.meter div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p1),#ec4899)}
.cta{background:linear-gradient(135deg,#0f172a,#312e81);color:#fff;border-radius:18px;padding:20px;margin-top:14px}.cta h3{margin:0 0 6px;font-size:22px}.cta p{margin:6px 0;opacity:.92}
.cta .price{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.cta .price div{background:#ffffff1f;border-radius:12px;padding:10px 14px}.cta .price b{font-size:22px;color:#fde047}.cta .price s{opacity:.7}
.rv{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fff}.rv.ok{border-left:6px solid var(--ok)}.rv.no{border-left:6px solid var(--bad)}.rv.sk{border-left:6px solid var(--warn)}
.rv .o{padding:8px 12px;border-radius:10px;margin:6px 0;border:1px solid var(--line);font-size:15px}.rv .o.c{background:#dcfce7;border-color:#86efac}.rv .o.w{background:#fee2e2;border-color:#fca5a5}
.sol{background:#f8fafc;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.hide{display:none!important}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:20px 10px 40px}
@media(max-width:900px){
 .exam{grid-template-columns:1fr}
 .pal{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;border-radius:18px 18px 0 0;transform:translateY(105%);transition:.25s;box-shadow:0 -10px 30px #0004;max-height:78vh;overflow:auto}
 .pal.open{transform:none}
 .palbtn{display:block;position:fixed;right:12px;bottom:12px;z-index:25;border-radius:999px;padding:12px 18px}
 .stats{grid-template-columns:repeat(2,1fr)}.score{grid-template-columns:1fr;justify-items:center;text-align:center}.kpis{grid-template-columns:repeat(2,1fr)}
 .ttl{display:none}.wrap{padding:10px}.card{padding:14px}.bar{padding-bottom:64px}
}
</style>
</head>

erif\" font-size=\"12\" role=\"img\"><line x1=\"20.0\" y1=\"40.0\" x2=\"20.0\" y2=\"110.0\" stroke=\"#1e293b\" stroke-width=\"6\"/><polyline points=\"20.0,75.0 34.4,75.0 40.1,84.0 51.5,66.0 62.9,84.0 74.3,66.0 85.7,84.0 97.1,66.0 108.5,84.0 119.9,66.0 125.6,75.0 140.0,75.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><rect x=\"150.0\" y=\"55.0\" width=\"40.0\" height=\"40.0\" rx=\"0\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"2\" /><text x=\"170.0\" y=\"80.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">0.5 kg<\/text><line x1=\"10.0\" y1=\"95.0\" x2=\"330.0\" y2=\"95.0\" stroke=\"#94a3b8\" stroke-width=\"1.4\"/><line x1=\"20.0\" y1=\"125.0\" x2=\"140.0\" y2=\"125.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"80.0\" y=\"142.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">compressed by 0.1 m<\/text><text x=\"80.0\" y=\"38.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">k = 200 N/m<\/text><line x1=\"200.0\" y1=\"75.0\" x2=\"280.0\" y2=\"75.0\" stroke=\"#059669\" stroke-width=\"2.4\" marker-end=\"url(#arg)\"/><text x=\"240.0\" y=\"65.0\" text-anchor=\"middle\" fill=\"#059669\" font-size=\"12\" font-weight=\"700\">v = ?<\/text><\/svg>", "o": ["2 m/s", "0.2 m/s", "4 m/s", "1 m/s"], "s": "½kx² = ½mv² ⇒ v = x√(k/m) = 0.1 × √(200/0.5) = 0.1 × 20 = <b>2 m/s<\/b>.", "a": 0}, {"sub": "Physics", "ch": "Thermodynamics", "d": "M", "q": "Two curves A and B start from the same initial state i on a P–V diagram, representing the expansion of an ideal gas (one isothermal, the other adiabatic). The adiabatic expansion is represented by:", "f": "<svg viewBox=\"0 0 380 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"50.0\" y1=\"165.0\" x2=\"358.0\" y2=\"165.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"165.0\" x2=\"50.0\" y2=\"17.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"358.0\" y=\"157.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">V<\/text><text x=\"56.0\" y=\"21.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">P<\/text><polyline points=\"140.6,83.8 149.7,91.1 158.8,97.3 167.8,102.5 176.9,107.0 185.9,110.8 195.0,114.2 204.1,117.2 213.1,119.9 222.2,122.2 231.2,124.4 240.3,126.3 249.4,128.1 258.4,129.7 267.5,131.1 276.6,132.5 285.6,133.8 294.7,134.9 303.8,136.0 312.8,137.0 321.9,137.9 330.9,138.8\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><polyline points=\"140.6,83.8 149.7,93.9 158.8,102.1 167.8,108.7 176.9,114.3 185.9,118.9 195.0,122.9 204.1,126.3 213.1,129.3 222.2,131.9 231.2,134.2 240.3,136.2 249.4,138.1 258.4,139.7 267.5,141.1 276.6,142.5 285.6,143.7 294.7,144.8 303.8,145.8 312.8,146.7 321.9,147.5 330.9,148.3\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"140.6\" cy=\"83.8\" r=\"4\" fill=\"#1e293b\"/><text x=\"132.6\" y=\"75.8\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\" font-style=\"italic\">i<\/text><text x=\"222.2\" y=\"114.2\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"14\" font-weight=\"700\">B<\/text><text x=\"231.2\" y=\"154.2\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"14\" font-weight=\"700\">A<\/text><\/svg>", "o": ["Both A and B", "Neither A nor B", "Curve A", "Curve B"], "s": "Adiabatic: PVᵞ = constant with γ > 1, so its slope (−γP/V) is steeper than the isothermal slope (−P/V). Steeper falling curve = <b>A<\/b>.", "a": 2}, {"sub": "Physics", "ch": "Capacitors", "d": "H", "q": "A parallel-plate capacitor has capacitance C₀ = ε₀A/d. A dielectric slab of constant K = 2 and thickness d/2 fills the lower half of the gap (figure). The new capacitance is:", "f": "<svg viewBox=\"0 0 330 195\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"60.0\" y1=\"40.0\" x2=\"220.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"60.0\" y1=\"160.0\" x2=\"220.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><rect x=\"60.0\" y=\"100.0\" width=\"160.0\" height=\"60.0\" rx=\"0\" fill=\"#fde68a\" stroke=\"#f59e0b\" stroke-width=\"1.5\" /><text x=\"140.0\" y=\"135.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">dielectric slab, K = 2<\/text><line x1=\"240.0\" y1=\"40.0\" x2=\"240.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"262.0\" y=\"104.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\" font-style=\"italic\">d<\/text><line x1=\"40.0\" y1=\"100.0\" x2=\"40.0\" y2=\"160.0\" stroke=\"#4f46e5\" stroke-width=\"1.2\" marker-end=\"url(#arb)\" marker-start=\"url(#arb)\"/><text x=\"32.0\" y=\"134.0\" text-anchor=\"end\" fill=\"#4f46e5\" font-size=\"11\">d/2<\/text><text x=\"140.0\" y=\"24.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">plates of area A (no battery connected)<\/text><text x=\"140.0\" y=\"182.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">C₀ = ε₀A/d without the slab<\/text><\/svg>", "o": ["3C₀/2", "3C₀/4", "4C₀/3", "2C₀"], "s": "Series combination: C = ε₀A/(t_air + t/K) = ε₀A/(d/2 + d/4) = ε₀A/(3d/4) = <b>4C₀/3<\/b>.", "a": 2}, {"sub": "Physics", "ch": "Magnetic Effects of Current", "d": "M", "q": "Two long straight parallel wires carry currents of 5 A and 10 A in the same direction, 10 cm apart (figure). The force per unit length between them is: (μ₀/4π = 10⁻⁷ T·m/A)", "f": "<svg viewBox=\"0 0 320 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"110.0\" y1=\"20.0\" x2=\"110.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"4\"/><line x1=\"210.0\" y1=\"20.0\" x2=\"210.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"4\"/><line x1=\"110.0\" y1=\"120.0\" x2=\"110.0\" y2=\"70.0\" stroke=\"#e11d48\" stroke-width=\"2.6\" marker-end=\"url(#arr)\"/><line x1=\"210.0\" y1=\"120.0\" x2=\"210.0\" y2=\"70.0\" stroke=\"#e11d48\" stroke-width=\"2.6\" marker-end=\"url(#arr)\"/><text x=\"95.0\" y=\"60.0\" text-anchor=\"end\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">5 A<\/text><text x=\"225.0\" y=\"60.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">10 A<\/text><line x1=\"112.0\" y1=\"185.0\" x2=\"208.0\" y2=\"185.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"160.0\" y=\"200.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">10 cm<\/text><\/svg>", "o": ["1×10⁻⁵ N/m, attractive", "1×10⁻⁴ N/m, repulsive", "2×10⁻⁴ N/m, attractive", "1×10⁻⁴ N/m, attractive"], "s": "F/L = μ₀I₁I₂/(2πd) = 2×10⁻⁷ × 5 × 10/0.1 = 1×10⁻⁴ N/m. Parallel currents <b>attract<\/b>.", "a": 3}, {"sub": "Physics", "ch": "Ray Optics", "d": "M", "q": "A plano-convex lens made of glass of refractive index 1.5 has the radius of curvature of its curved surface equal to 30 cm (figure). Its focal length is:", "f": "<svg viewBox=\"0 0 350 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"20.0\" y1=\"100.0\" x2=\"330.0\" y2=\"100.0\" stroke=\"#94a3b8\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"/><path d=\"M190 40 Q150 100 190 160\" fill=\"#bae6fd\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"190.0\" y1=\"40.0\" x2=\"190.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><text x=\"190.0\" y=\"28.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">plano-convex lens<\/text><circle cx=\"190.0\" cy=\"100.0\" r=\"2.5\" fill=\"#1e293b\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"250.0\" y=\"120.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">μ = 1.5<\/text><text x=\"200.0\" y=\"88.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">R = 30 cm<\/text><circle cx=\"236.0\" cy=\"100.0\" r=\"3.5\" fill=\"#e11d48\"/><text x=\"236.0\" y=\"118.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"11\">C (centre)<\/text><line x1=\"236.0\" y1=\"100.0\" x2=\"174.0\" y2=\"100.0\" stroke=\"#e11d48\" stroke-width=\"1.4\" marker-end=\"url(#arr)\"/><\/svg>", "o": ["30 cm", "60 cm", "45 cm", "90 cm"], "s": "Lens-maker’s formula: 1/f = (μ − 1)(1/R₁ − 1/R₂) = 0.5 × (1/30 − 0) ⇒ f = <b>60 cm<\/b>.", "a": 1}, {"sub": "Physics", "ch": "Nuclei", "d": "M", "q": "The binding energy per nucleon versus mass number curve is shown. Which of the following statements is correct according to the curve?", "f": "<svg viewBox=\"0 0 390 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"50.0\" y1=\"165.0\" x2=\"368.0\" y2=\"165.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"165.0\" x2=\"50.0\" y2=\"17.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"368.0\" y=\"157.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">Mass number A<\/text><text x=\"56.0\" y=\"21.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">B.E. / nucleon (MeV)<\/text><line x1=\"110.0\" y1=\"162.0\" x2=\"110.0\" y2=\"168.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"110.0\" y=\"179.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">50<\/text><line x1=\"170.0\" y1=\"162.0\" x2=\"170.0\" y2=\"168.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"170.0\" y=\"179.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">100<\/text><line x1=\"230.0\" y1=\"162.0\" x2=\"230.0\" y2=\"168.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"230 t-size=\"12\" font-style=\"italic\">1/T (×10⁻³ K⁻¹)<\/text><text x=\"147.5\" y=\"66.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">(3.0, 4)<\/text><text x=\"296.3\" y=\"138.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">(3.5, 1)<\/text><\/svg>", "o": ["25 kJ/mol", "50 kJ/mol", "100 kJ/mol", "12.5 kJ/mol"], "s": "Slope = −E_a/R = (1 − 4)/(0.5×10⁻³) = −6000 K. E_a = 6000 × 8.314 ≈ 49.9 kJ/mol ≈ <b>50 kJ/mol<\/b>.", "a": 1}, {"sub": "Chemistry", "ch": "Electrochemistry", "d": "E", "q": "A Daniell cell is set up as shown with the standard electrode potentials given. The standard emf (E°cell) of the cell is:", "f": "<svg viewBox=\"0 0 360 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><rect x=\"40.0\" y=\"90.0\" width=\"90.0\" height=\"90.0\" rx=\"0\" fill=\"#e2e8f0\" stroke=\"#1e293b\" stroke-width=\"2\" /><rect x=\"40.0\" y=\"120.0\" width=\"90.0\" height=\"60.0\" rx=\"0\" fill=\"#cbd5e1\" stroke=\"none\" stroke-width=\"0\" /><rect x=\"230.0\" y=\"90.0\" width=\"90.0\" height=\"90.0\" rx=\"0\" fill=\"#e2e8f0\" stroke=\"#1e293b\" stroke-width=\"2\" /><rect x=\"230.0\" y=\"120.0\" width=\"90.0\" height=\"60.0\" rx=\"0\" fill=\"#bae6fd\" stroke=\"none\" stroke-width=\"0\" /><rect x=\"40.0\" y=\"120.0\" width=\"90.0\" height=\"60.0\" rx=\"0\" fill=\"#e5e7eb\" stroke=\"none\" stroke-width=\"0\" /><rect x=\"70.0\" y=\"50.0\" width=\"12.0\" height=\"100.0\" rx=\"0\" fill=\"#94a3b8\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><rect x=\"262.0\" y=\"50.0\" width=\"12.0\" height=\"100.0\" rx=\"0\" fill=\"#fb923c\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><text x=\"76.0\" y=\"44.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">Zn<\/text><text x=\"268.0\" y=\"44.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">Cu<\/text><path d=\"M105 90 L105 70 L255 70 L255 90\" fill=\"#fef9c3\" stroke=\ b\" stroke-width=\"2.6\"/><line x1=\"110.0\" y1=\"120.0\" x2=\"150.0\" y2=\"85.0\" stroke=\"#1e293b\" stroke-width=\"2.6\"/><line x1=\"150.0\" y1=\"85.0\" x2=\"150.0\" y2=\"38.0\" stroke=\"#1e293b\" stroke-width=\"2.6\"/><line x1=\"150.0\" y1=\"85.0\" x2=\"190.0\" y2=\"120.0\" stroke=\"#1e293b\" stroke-width=\"2.6\"/><text x=\"130.0\" y=\"165.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">skeletal formula (each vertex is a carbon atom)<\/text><\/svg>", "o": ["4,4-dimethylbut-1-ene", "2-ethylbut-3-ene", "2-methylpent-4-ene", "4-methylpent-1-ene"], "s": "Longest chain containing the double bond has 5 carbons (pent-ene). Number from the end that gives the double bond the lowest locant: C1=C2, with a methyl group on C4. Name: <b>4-methylpent-1-ene<\/b>.", "a": 3}, {"sub": "Chemistry", "ch": "Haloalkanes", "d": "E", "q": "Which of the following alkyl bromides undergoes the SN2 reaction with the fastest rate?", "f": "", "o": ["CH₃CH₂Br", "CH₃Br", "(CH₃)₃CBr", "(CH₃)₂CHBr"], "s": "SN2 rate depends on steric hindrance at the carbon being attacked: methyl &gt; 1° &gt; 2° &gt; 3°. So <b>CH₃Br<\/b> reacts fastest; (CH₃)₃CBr prefers SN1.", "a": 1}, {"sub": "Chemistry", "ch": "Coordination Compounds", "d": "H", "q": "The crystal-field splitting of the d-orbitals of Fe²⁺ in the octahedral complex [Fe(CN)₆]⁴⁻ is shown (CN⁻ is a strong-field ligand). The number of unpaired electrons in the complex is:", "f": "<svg viewBox=\"0 0 350 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"70.0\" y1=\"175.0\" x2=\"70.0\" y2=\"30.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"66.0\" y=\"22.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\" font-style=\"italic\">Energy<\/text><line x1=\"130.0\" y1=\"55.0\" x2=\"170.0\" y2=\"55.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"190.0\" y1=\"55.0\" x2=\"230.0\" y2=\"55.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><text x=\"150.0\" y=\"45.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">e_g<\/text><text x=\"150.0\" y=\"25.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">(empty)<\/text><line x1=\"110.0\" y1=\"135.0\" x2=\"150.0\" y2=\"135.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"124.0\" y1=\"143.0\" x2=\"124.0\" y2=\"118.0\" stroke=\"#4f46e5\" stroke-width=\"1.8\" marker-end=\"url(#arb)\"/><line x1=\"136.0\" y1=\"118.0\" x2=\"136.0\" y2=\"143.0\" stroke=\"#e11d48\" stroke-width=\"1.8\" marker-end=\"url(#arr)\"/><line x1=\"160.0\" y1=\"135.0\" x2=\"200.0\" y2=\"135.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"174.0\" y1=\"143.0\" x2=\"174.0\" y2=\"118.0\" stroke=\"#4f46e5\" stroke-width=\"1.8\" marker-end=\"url(#arb)\"/><line x1=\"186.0\" y1=\"118.0\" x2=\"186.0\" y2=\"143.0\" stroke=\"#e11d48\" stroke-width=\"1.8\" marker-end=\"url(#arr)\"/><line x1=\"210.0\" y1=\"135.0\" x2=\"250.0\" y2=\"135.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"224.0\" y1=\"143.0\" x2=\"224.0\" y2=\"118.0\" stroke=\"#4f46e5\" stroke-width=\"1.8\" marker-end=\"url(#arb)\"/><line x1=\"236.0\" y1=\"118.0\" x2=\"236.0\" y2=\"143.0\" stroke=\"#e11d48\" stroke-width=\"1.8\" marker-end=\"url(#arr)\"/><text x=\"150.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">t₂g<\/text><text x=\"240.0\" y=\"100.0\" text-anchor=\"middle\" fill=\"#059669\" font-size=\"12\" font-weight=\"700\">Δₒ<\/text><line x1=\"250.0\" y1=\"59.0\" x2=\"250.0\" y2=\"131.0\" stroke=\"#059669\" stroke-width=\"1.4\" marker-end=\"url(#arg)\" marker-start=\"url(#arg)\"/><text x=\"160.0\" y=\"190.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">[Fe(CN)₆]⁴⁻ : Fe²⁺ is d⁶ and CN⁻ is a strong-field ligand<\/text><\/svg>", "o": ["2", "6", "4", "0"], "s": "Strong-field ligand ⇒ Δₒ &gt; pairing energy, so all six d-electrons pair up in t₂g (t₂g⁶ e_g⁰): <b>zero<\/b> unpaired electrons — the complex is diamagnetic (low spin).", "a": 3}, {"sub": "Biology", "ch": "Cell Cycle", "d": "E", "q": "The eukaryotic cell cycle is shown with four phases A, B, C and D (the cycle runs clockwise; A follows cell division, and D is the stage in which the nucleus divides). DNA replication takes place in the phase labelled:", "f": "<svg viewBox=\"0 0 300 215\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><path d=\"M150 100 L150.0 20.0 A80 80 0 0 1 177.4 175.2 Z\" fill=\"#bfdbfe\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"201.2\" y=\"96.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"18\" font-weight=\"700\">A<\/text><path d=\"M150 100 L177.4 175.2 A80 80 0 0 1 93.4 156.6 Z\" fill=\"#fde68a\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"138.7\" y=\"155.8\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"18\" font-weight=\"700\">B<\/text><path d=\"M150 100 L93.4 156.6 A80 80 0 0 1 93.4 43.4 Z\" fill=\"#d1fae5\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"98.0\" y=\"105.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"18\" font-weight=\"700\">C<\/text><path d=\"M150 100 L93.4 43.4 A80 80 0 0 1 150.0 20.0 Z\" fill=\"#fecdd3\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"130.1\" y=\"57.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"18\" font-weight=\"700\">D<\/text><text x=\"150.0\" y=\"205.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">The cycle runs clockwise; A follows cell division (cytokinesis)<\/text><text x=\"150.0\" y=\"14.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\"><\/text><\/svg>", "o": ["D", "C", "B", "A"], "s": "The cycle is G₁ (A, largest, growth) → <b>S (B, DNA replication)<\/b> → G₂ (C, preparation for division) → M (D, mitosis). DNA content doubles only in S phase.", "a": 2}, {"sub": "Biology", "ch": "Principles of Inheritance", "d": "M", "q": "A pedigree is shown for a rare trait. Both parents (I-1, I-2) are unaffected, but their daughter II-2 is affected. The most probable mode of inheritance is:", "f": "<svg viewBox=\"0 0 330 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"125.0\" y1=\"55.0\" x2=\"190.0\" y2=\"55.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><rect x=\"95.0\" y=\"40.0\" width=\"30.0\" height=\"30.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"2\" /><circle cx=\"205.0\" cy=\"55.0\" r=\"15\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"2\"/><text x=\"110.0\" y=\"35.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">I-1<\/text><text x=\"205.0\" y=\"35.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">I-2<\/text><line x1=\"158.0\" y1=\"55.0\" x2=\"158.0\" y2=\"95.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"70.0\" y1=\"95.0\" x2=\"250.0\" y2=\"95.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"70.0\" y1=\"95.0\" x2=\"70.0\" y2=\"112.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><rect x=\"55.0\" y=\"112.0\" width=\"30.0\" height=\"30.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"2\" /><text x=\"70.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">II-1<\/text><line x1=\"158.0\" y1=\"95.0\" x2=\"158.0\" y2=\"112.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><circle cx=\"158.0\" cy=\"127.0\" r=\"15\" fill=\"#1e293b\" stroke=\"#1e293b\" stroke-width=\"2\"/><text x=\"158.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">II-2<\/text><line x1=\"250.0\" y1=\"95.0\" x2=\"250.0\" y2=\"112.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><rect x=\"235.0\" y=\"112.0\" width=\"30.0\" height=\"30.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"2\" /><text x=\"250.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">II-3<\/text><text x=\"158.0\" y=\"190.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">■ / ● filled = affected   □ / ○ open = unaffected   (square = male, circle = female)<\/text><\/svg>", "o": ["Autosomal recessive", "X-linked dominant", "Autosomal dominant", "Y-linked"], "s": "Two unaffected parents with an affected child ⇒ the trait is <b>recessive<\/b> (parents are carriers). An affected daughter of an unaffected father rules out X-linked recessive, so it is autosomal recessive.", "a": 0}, {"sub": "Biology", "ch": "Molecular Basis of Inheritance", "d": "M", "q": "A replication fork is shown (the fork moves to the right). The strand marked Y is synthesised in short pieces, away from the fork. The strand Y and its fragments are called:", "f": "<svg viewBox=\"0 0 330 205\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"20.0\" y1=\"100.0\" x2=\"120.0\" y2=\"100.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"20.0\" y1=\"112.0\" x2=\"120.0\" y2=\"112.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><path d=\"M120 100 C150 100 160 60 220 55\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"3\"/><path d=\"M120 112 C150 112 160 152 220 157\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"150.0\" y1=\"62.0\" x2=\"210.0\" y2=\"62.0\" stroke=\"#4f46e5\" stroke-width=\"3.2\" marker-end=\"url(#arb)\"/><text x=\"190.0\" y=\"52.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"14\" font-weight=\"700\">X<\/text><text x=\"165.0\" y=\"24.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"10\">X: new strand made continuously, same direction as the fork<\/text><line x1=\"210.0\" y1=\"142.0\" x2=\"192.0\" y2=\"142.0\" stroke=\"#e11d48\" stroke-width=\"3.2\" marker-end=\"url(#arr)\"/><line x1=\"184.0\" y1=\"142.0\" x2=\"166.0\" y2=\"142.0\" stroke=\"#e11d48\" stroke-width=\"3.2\" marker-end=\"url(#arr)\"/><line x1=\"158.0\" y1=\"142.0\" x2=\"140.0\" y2=\"142.0\" stroke=\"#e11d48\" stroke-width=\"3.2\" marker-end=\"url(#arr)\"/><text x=\"190.0\" y=\"172.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"14\" font-weight=\"700\">Y<\/text><text x=\"165.0\" y=\"192.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"10\">Y: new strand made in short pieces, away from the fork<\/text><text x=\"40.0\" y=\"130.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">parental DNA<\/text><line x1=\"260.0\" y1=\"100.0\" x2=\"300.0\" y2=\"100.0\" stroke=\"#94a3b8\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"300.0\" y=\"90.0\" text-anchor=\"end\" fill=\"#94a3b8\" font-size=\"10\">fork moves →<\/text><\/svg>", "o": ["Leading strand; Okazaki fragments", "Lagging strand; primer fragments made by helicase", "Lagging strand; Okazaki fragments", "Leading strand; continuous strand"], "s": "DNA polymerase adds nucleotides only in the 5′→3′ direction. On one template it follows the fork continuously (leading strand, X); on the other it must work away from the fork in pieces — the <b>lagging strand, Okazaki fragments<\/b> — later joined by DNA ligase.", "a": 2}, {"sub": "Biology", "ch": "Photosynthesis", "d": "E", "q": "The graph shows the effect of light intensity on the rate of photosynthesis. Beyond the point P, increasing light intensity does not increase the rate because:", "f": "<svg viewBox=\"0 0 390 195\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"50.0\" y1=\"165.0\" x2=\"358.0\" y2=\"165.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"165.0\" x2=\"50.0\" y2=\"22.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"358.0\" y=\"157.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">Light intensity<\/text><text x=\"56.0\" y=\"26.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">Rate of photosynthesis<\/text><polyline points=\"50.0,165.0 79.0,146.2 137.0,108.8 195.0,83.8 224.0,75.0 253.0,71.2 282.0,71.2 340.0,71.2\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><circle cx=\"238.5\" cy=\"72.5\" r=\"4\" fill=\"#e11d48\"/><text x=\"238.5\" y=\"62.5\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"14\" font-weight=\"700\">P<\/text><line x1=\"238.5\" y1=\"72.5\" x2=\"238.5\" y2=\"165.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><\/svg>", "o": ["stomata close completely above this point", "some other factor, such as CO₂ concentration or temperature, has become limiting", "light has become the limiting factor", "chlorophyll is destroyed at high light intensity"], "s": "At low light, light is the limiting factor (rate rises with intensity). At the plateau, light is in excess and the rate is controlled by another factor — <b>CO₂ concentration, temperature or enzyme availability<\/b> (Blackman’s law of limiting factors).", "a": 1}, {"sub": "Biology", "ch": "Sexual Reproduction in Flowering Plants", "d": "M", "q": "A mature embryo sac of a typical angiosperm (Polygonum type) is shown. The total number of nuclei and the total number of cells in it are respectively:", "f": "<svg viewBox=\"0 0 320 205\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><ellipse cx=\"180\" cy=\"100\" rx=\"125\" ry=\"75\" fill=\"#fef9c3\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><circle cx=\"92.0\" cy=\"80.0\" r=\"11\" fill=\"#fed7aa\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><circle cx=\"92.0\" cy=\"80.0\" r=\"3\" fill=\"#f59e0b\"/><circle cx=\"92.0\" cy=\"120.0\" r=\"11\" fill=\"#fed7aa\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><circle cx=\"92.0\" cy=\"120.0\" r=\"3\" fill=\"#f59e0b\"/><circle cx=\"112.0\" cy=\"100.0\" r=\"11\" fill=\"#fed7aa\" stroke=\"#f59e0b\" stroke-width=\"1.6\"/><circle cx=\"112.0\" cy=\"100.0\" r=\"3\" fill=\"#f59e0b\"/><text x=\"92.0\" y=\"192.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">micropylar end<\/text><circle cx=\"268.0\" cy=\"70.0\" r=\"11\" fill=\"#bbf7d0\" stroke=\"#059669\" stroke-width=\"1.6\"/><circle cx=\"268.0\" cy=\"70.0\" r=\"3\" fill=\"#059669\"/><circle cx=\"276.0\" cy=\"100.0\" r=\"11\" fill=\"#bbf7d0\" stroke=\"#059669\" stroke-width=\"1.6\"/><circle cx=\"276.0\" cy=\"100.0\" r=\"3\" fill=\"#059669\"/><circle cx=\"268.0\" cy=\"130.0\" r=\"11\" fill=\"#bbf7d0\" stroke=\"#059669\" stroke-width=\"1.6\"/><circle cx=\"268.0\" cy=\"130.0\" r=\"3\" fill=\"#059669\"/><circle cx=\"180.0\" cy=\"100.0\" r=\"38\" fill=\"#e0e7ff\" stroke=\"#4f46e5\" stroke-width=\"1.6\"/><circle cx=\"172.0\" cy=\"98.0\" r=\"4\" fill=\"#4f46e5\"/><circle cx=\"188.0\" cy=\"102.0\" r=\"4\" fill=\"#4f46e5\"/><text x=\"180.0\" y=\"152.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"10\">large central cell<\/text><text x=\"268.0\" y=\"192.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">chalazal end<\/text><text x=\"108.0\" y=\"150.0\" text-anchor=\"middle\" fill=\"#f59e0b\" font-size=\"10\" font-weight=\"700\">egg apparatus<\/text><text x=\"254.0\" y=\"150.0\" text-anchor=\"middle\" fill=\"#059669\" font-size=\"10\" font-weight=\"700\">antipodals<\/text><text x=\"180.0\" y=\"55.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"10\" font-weight=\"700\">2 polar nuclei<\/text><\/svg>", "o": ["4 and 4", "8 and 7", "7 and 8", "8 and 8"], "s": "Embryo sac: egg apparatus (egg + 2 synergids) = 3 cells, 3 antipodals = 3 cells, plus the large central cell (2 polar nuclei) = 7 cells. Nuclei: 3 + 3 + 2 = <b>8 nuclei, 7 cells<\/b>.", "a": 1}, {"sub": "Biology", "ch": "Body Fluids & Circulation", "d": "E", "q": "A normal electrocardiogram (ECG) of a human is shown. The QRS complex represents:", "f": "<svg viewBox=\"0 0 300 205\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"10.0\" y1=\"120.0\" x2=\"280.0\" y2=\"120.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><polyline points=\"20.0,120.0 50.0,120.0 62.0,112.0 74.0,120.0 100.0,120.0 110.0,128.0 120.0,40.0 130.0,150.0 140.0,120.0 170.0,120.0 200.0,100.0 222.0,120.0 260.0,120.0\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><text x=\"62.0\" y=\"100.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"14\" font-weight=\"700\">P<\/text><text x=\"120.0\" y=\"28.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"14\" font-weight=\"700\">R<\/text><text x=\"106.0\" y=\"144.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"13\" font-weight=\"700\">Q<\/text><text x=\"134.0\" y=\"168.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"13\" font-weight=\"700\">S<\/text><text x=\"200.0\" y=\"88.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"14\" font-weight=\"700\">T<\/text><line x1=\"106.0\" y1=\"178.0\" x2=\"138.0\" y2=\"178.0\" stroke=\"#4f46e5\" stroke-width=\"1.4\" marker-end=\"url(#arb)\" marker-start=\"url(#arb)\"/><text x=\"122.0\" y=\"194.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"11\" font-weight=\"700\">QRS complex<\/text><\/svg>", "o": ["depolarisation of the atria", "repolarisation of the ventricles", "depolarisation of the ventricles, which triggers ventricular contraction", "repolarisation of the atria"], "s": "P wave = atrial depolarisation (atrial systole); <b>QRS = ventricular depolarisation<\/b> (start of ventricular systole); T wave = ventricular repolarisation. Atrial repolarisation is hidden within QRS.", "a": 2}, {"sub": "Biology", "ch": "Neural Control & Coordination", "d": "M", "q": "The action potential of a neuron is shown. The rapid rise marked X (from −55 mV to +30 mV) is due to:", "f": "<svg viewBox=\"0 0 350 205\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"50.0\" y1=\"100.0\" x2=\"330.0\" y2=\"100.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"190.0\" x2=\"50.0\" y2=\"15.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"330.0\" y=\"118.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\
