<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--p1:#4f46e5;--p2:#7c3aed;--hot:#f97316;--hot2:#ef4444;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.top{background:linear-gradient(110deg,#312e81,#6d28d9 55%,#db2777);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0003}
.brand{font-weight:800;letter-spacing:.2px;font-size:15px;line-height:1.15}.brand small{display:block;font-weight:500;opacity:.85;font-size:11px}
.ttl{flex:1;font-size:13px;opacity:.95;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{background:#0f172a99;border:1px solid #ffffff55;border-radius:10px;padding:5px 12px;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;min-width:84px;text-align:center}
.timer.low{background:var(--hot2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.wrap{max-width:1120px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px #0f172a14,0 8px 24px #0f172a0a;padding:18px}
/* start */
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#db2777);color:#fff;border-radius:20px;padding:26px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:#ffffff1f}
.hero h1{margin:6px 0 8px;font-size:clamp(24px,5vw,38px);line-height:1.15}
.pill{display:inline-block;background:#fde047;color:#422006;font-weight:800;font-size:12px;border-radius:999px;padding:4px 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:#ffffff26;border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;opacity:.9}
.rules{margin:14px 0 0;padding-left:18px;color:#334155;font-size:14px}.rules li{margin:5px 0}
.inp{width:100%;font:inherit;padding:13px 14px;border:2px solid var(--line);border-radius:12px;margin:8px 0 12px;font-size:16px}.inp:focus{outline:none;border-color:var(--p1)}
.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--hot),var(--hot2));box-shadow:0 6px 16px #ef444455}
.btn.alt{background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 6px 16px #4f46e555}
.btn.ghost{background:#fff;color:var(--p1);border:2px solid var(--p1);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:14px;box-shadow:none}
.btn:active{transform:translateY(1px)}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;color:#334155}
.tab.on{background:var(--p1);border-color:var(--p1);color:#fff}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:10px}
.qn{background:var(--p1);color:#fff;border-radius:8px;padding:3px 11px;font-weight:800;font-size:14px}
.tag{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#eef2ff;color:#4338ca}.tag.E{background:#dcfce7;color:#166534}.tag.M{background:#fef9c3;color:#854d0e}.tag.H{background:#fee2e2;color:#991b1b}
.mk{margin-left:auto;font-weight:700;color:#334155}.mk i{font-style:normal;color:var(--ok)}.mk u{text-decoration:none;color:var(--bad)}
.qt{font-size:17px;line-height:1.6;margin:6px 0 10px}
.fig{background:linear-gradient(#fff,#f8fafc);border:1px solid var(--line);border-radius:14px;padding:8px;margin:8px 0 14px;text-align:center}
.fig svg{width:100%;max-width:470px;height:auto;display:inline-block}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.45;color:var(--ink);transition:.12s}
.opt:hover{border-color:#a5b4fc;background:#f5f3ff}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;font-weight:800;font-size:13px;color:#475569}
.opt.sel{border-color:var(--p1);background:#eef2ff;box-shadow:0 0 0 3px #4f46e522}.opt.sel .k{background:var(--p1);border-color:var(--p1);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.bar .sp{flex:1}
.pal{position:sticky;top:64px}
.pal h3{margin:0 0 4px;font-size:15px}.cand{font-size:12px;color:var(--mut);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:46vh;overflow:auto;padding:2px}
.pb{height:40px;border:0;border-radius:8px;font-weight:800;font-size:14px;background:#e2e8f0;color:#334155;position:relative}
.pb.s1{background:#ef4444;color:#fff;border-radius:8px 8px 18px 18px}.pb.s2{background:#22c55e;color:#fff;border-radius:18px 18px 8px 8px}.pb.s3{background:#8b5cf6;color:#fff;border-radius:50%}.pb.s4{background:#8b5cf6;color:#fff;border-radius:50%}
.pb.s4:after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.pb.cur{outline:3px solid var(--hot);outline-offset:1px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;color:#475569;margin:10px 0}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.palbtn{display:none}
/* modal */
.modal{position:fixed;inset:0;background:#0f172a99;display:none;place-items:center;z-index:50;padding:16px}.modal.on{display:grid}
.mbox{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%}.mbox h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* result */
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e2e8f0 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}.ring b{font-size:30px;line-height:1}.ring span{font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--mut)}
.subrow{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:14px;font-weight:700}
.meter{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}.meter div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p1),#ec4899)}
.cta{background:linear-gradient(135deg,#0f172a,#312e81);color:#fff;border-radius:18px;padding:20px;margin-top:14px}.cta h3{margin:0 0 6px;font-size:22px}.cta p{margin:6px 0;opacity:.92}
.cta .price{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.cta .price div{background:#ffffff1f;border-radius:12px;padding:10px 14px}.cta .price b{font-size:22px;color:#fde047}.cta .price s{opacity:.7}
.rv{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fff}.rv.ok{border-left:6px solid var(--ok)}.rv.no{border-left:6px solid var(--bad)}.rv.sk{border-left:6px solid var(--warn)}
.rv .o{padding:8px 12px;border-radius:10px;margin:6px 0;border:1px solid var(--line);font-size:15px}.rv .o.c{background:#dcfce7;border-color:#86efac}.rv .o.w{background:#fee2e2;border-color:#fca5a5}
.sol{background:#f8fafc;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.hide{display:none!important}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:20px 10px 40px}
@media(max-width:900px){
 .exam{grid-template-columns:1fr}
 .pal{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;border-radius:18px 18px 0 0;transform:translateY(105%);transition:.25s;box-shadow:0 -10px 30px #0004;max-height:78vh;overflow:auto}
 .pal.open{transform:none}
 .palbtn{display:block;position:fixed;right:12px;bottom:12px;z-index:25;border-radius:999px;padding:12px 18px}
 .stats{grid-template-columns:repeat(2,1fr)}.score{grid-template-columns:1fr;justify-items:center;text-align:center}.kpis{grid-template-columns:repeat(2,1fr)}
 .ttl{display:none}.wrap{padding:10px}.card{padding:14px}.bar{padding-bottom:64px}
}
</style>
</head>

"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">2 kg<\/text><line x1=\"10.0\" y1=\"112.0\" x2=\"330.0\" y2=\"112.0\" stroke=\"#94a3b8\" stroke-width=\"1.4\"/><text x=\"175.0\" y=\"40.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">The blocks stick together after collision<\/text><text x=\"175.0\" y=\"140.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"11\" font-weight=\"700\">Find the loss of kinetic energy (in J)<\/text><\/svg>", "o": [], "t": "n", "a": 12, "tol": 0.011, "s": "Momentum: 1×6 = 3v ⇒ v = 2 m/s. KE before = ½×1×36 = 18 J; after = ½×3×4 = 6 J. Loss = <b>12 J<\/b>.", "unit": "J"}, {"sub": "Physics", "ch": "Current Electricity", "d": "M", "q": "Five resistors are connected as in the bridge shown (10 Ω, 30 Ω, 20 Ω, 60 Ω and a 5 Ω in the middle). The equivalent resistance between A and B, in ohms (to two decimal places), is:", "f": "<svg viewBox=\"0 0 350 185\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><polyline points=\"40.0,100.0 170.0,40.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"170.0,40.0 300.0,100.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"40.0,100.0 170.0,160.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"170.0,160.0 300.0,100.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"170.0,40.0 170.0,160.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"105.0\" cy=\"70.0\" r=\"13\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"75.0\" y=\"60.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">10 Ω<\/text><circle cx=\"235.0\" cy=\"70.0\" r=\"13\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"270.0\" y=\"60.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">30 Ω<\/text><circle cx=\"105.0\" cy=\"130.0\" r=\"13\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"75.0\" y=\"148.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">20 Ω<\/text><circle cx=\"235.0\" cy=\"130.0\" r=\"13\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"270.0\" y=\"148.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">60 Ω<\/text><circle cx=\"170.0\" cy=\"100.0\" r=\"13\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"185.0\" y=\"104.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">5 Ω<\/text><text x=\"32.0\" y=\"104.0\" text-anchor=\"end\" fill=\"#4f46e5\" font-size=\"13\" font-weight=\"700\">A<\/text><text x=\"308.0\" y=\"104.0\" text-anchor=\"start\" fill=\"#4f46e5\" font-size=\"13\" font-weight=\"700\">B<\/text><\/svg>", "o": [], "t": "n", "a": 26.67, "tol": 0.03, "s": "Balance condition: R(AC)/R(CB) = 10/30 = 1/3 and R(AD)/R(DB) = 20/60 = 1/3, so the bridge is balanced and no current flows through the 5 Ω resistor. Upper path A–C–B = 10 + 30 = 40 Ω; lower path A–D–B = 20 + 60 = 80 Ω. In parallel: (40 × 80)/(40 + 80) = <b>26.67 Ω<\/b>.", "unit": "Ω"}, {"sub": "Physics", "ch": "Thermal Properties of Matter", "d": "M", "q": "Two rods of the same length and cross-section, with thermal conductivities k₁ = 400 and k₂ = 200 (W m⁻¹ K⁻¹), are joined end to end. The free ends are held at 100 °C and 0 °C (figure). In steady state, the temperature of the junction, in °C (to one decimal place), is:", "f": "<svg viewBox=\"0 0 350 160\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><rect x=\"40.0\" y=\"70.0\" width=\"130.0\" height=\"40.0\" rx=\"0\" fill=\"#fecaca\" stroke=\"#e11d48\" stroke-width=\"2\" /><text x=\"105.0\" y=\"95.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">k₁ = 400<\/text><rect x=\"170.0\" y=\"70.0\" width=\"130.0\" height=\"40.0\" rx=\"0\" fill=\"#bfdbfe\" stroke=\"#4f46e5\" stroke-width=\"2\" /><text x=\"235.0\" y=\"95.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">k₂ = 200<\/text><text x=\"35.0\" y=\"94.0\" text-anchor=\"end\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">100 °C<\/text><text x=\"306.0\" y=\"94.0\" text-anchor=\"start\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">0 °C<\/text><line x1=\"170.0\" y1=\"56.0\" x2=\"170.0\" y2=\"124.0\" stroke=\"#1e293b\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\"/><text x=\"170.0\" y=\"140.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">junction T = ?<\/text><\/svg>", "o": [], "t": "n", "a": 66.7, "tol": 0.06, "s": "Steady state: heat flow is the same: k₁(100 − T) = k₂(T − 0) ⇒ 400(100 − T) = 200 T ⇒ 40000 = 600 T ⇒ T = <b>66.7 °C<\/b>.", "unit": "°C"}, {"sub": "Physics", "ch": "Thermodynamics", "d": "E", "q": "A Carnot engine works between a source at 500 K and a sink at 300 K and absorbs 2000 J of heat from the source per cycle (figure). The work done per cycle, in joules, is:", "f": "<svg viewBox=\"0 0 330 195\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><rect x=\"110.0\" y=\"70.0\" width=\"70.0\" height=\"60.0\" rx=\"0\" fill=\"#fef3c7\" stroke=\"#f59e0b\" stroke-width=\"2\" /><text x=\"145.0\" y=\"105.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">Carnot<\/text><text x=\"145.0\" y=\"120.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">engine<\/text><rect x=\"60.0\" y=\"14.0\" width=\"170.0\" height=\"22.0\" rx=\"0\" fill=\"#fecaca\" stroke=\"#e11d48\" stroke-width=\"1.6\" /><text x=\"145.0\" y=\"30.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">source 500 K<\/text><rect x=\"60.0\" y=\"164.0\" width=\"170.0\" height=\"22.0\" rx=\"0\" fill=\"#bfdbfe\" stroke=\"#4f46e5\" stroke-width=\"1.6\" /><text x=\"145.0\" y=\"180.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">sink 300 K<\/text><line x1=\"145.0\" y1=\"36.0\" x2=\"145.0\" y2=\"68.0\" stroke=\"#e11d48\" stroke-width=\"3\" marker-end=\"url(#arr)\"/><text x=\"155.0\" y=\"56.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"11\" font-weight=\"700\">Q₁ = 2000 J<\/text><line x1=\"145.0\" y1=\"132.0\" x2=\"145.0\" y2=\"162.0\" stroke=\"#4f46e5\" stroke-width=\"3\" marker-end=\"url(#arb)\"/><line x1=\"182.0\" y1=\"100.0\" x2=\"230.0\" y2=\"100.0\" stroke=\"#059669\" stroke-width=\"3\" marker-end=\"url(#arg)\"/><text x=\"236.0\" y=\"104.0\" text-anchor=\"start\" fill=\"#059669\" font-size=\"12\" font-weight=\"700\">W = ?<\/text><\/svg>", "o": [], "t": "n", "a": 800, "tol": 0.011, "s": "η = 1 − T₂/T₁ = 1 − 300/500 = 0.4. W = ηQ₁ = 0.4 × 2000 = <b>800 J<\/b>.", "unit": "J"}, {"sub": "Physics", "ch": "Rotational Motion", "d": "M", "q": "A disc of moment of inertia 2 kg m² rotates freely about a vertical axis at 6 rad/s. A non-rotating ring of moment of inertia 1 kg m² is dropped on it coaxially and sticks (figure). The final angular speed, in rad/s, is:", "f": "<svg viewBox=\"0 0 330 175\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><ellipse cx=\"110\" cy=\"110\" rx=\"70\" ry=\"20\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"110.0\" y=\"114.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"10\" font-weight=\"700\">disc I₁ = 2 kg m²<\/text><ellipse cx=\"110\" cy=\"50\" rx=\"40\" ry=\"12\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"3\"/><line x1=\"110.0\" y1=\"70.0\" x2=\"110.0\" y2=\"90.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"160.0\" y=\"56.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"10\" font-weight=\"700\">ring I₂ = 1 kg m²<\/text><path d=\"M190 110 A80 25 0 0 1 150 130\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2.4\" marker-end=\"url(#arg)\"/><text x=\"200.0\" y=\"130.0\" text-anchor=\"start\" fill=\"#059669\" font-size=\"10\" font-weight=\"700\">ω₁ = 6 rad/s<\/text><line x1=\"110.0\" y1=\"130.0\" x2=\"110.0\" y2=\"160.0\" stroke=\"#94a3b8\" stroke-width=\"3\"/><\/svg>", "o": [], "t": "n", "a": 4, "tol": 0.011, "s": "No external torque ⇒ angular momentum is conserved: I₁ω₁ = (I₁ + I₂)ω ⇒ 2×6 = 3ω ⇒ ω = <b>4 rad/s<\/b>.", "unit": "rad/s"}, {"sub": "Chemistry", "ch": "Chemical Kinetics", "d": "M", "q": "The initial rates of the reaction A + B → products were measured as shown in the table. The rate law and the rate constant k are:", "f": "<svg viewBox=\"0 0 360 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><rect x=\"20.0\" y=\"20.0\" width=\"55.0\" height=\"34.0\" rx=\"0\" fill=\"#e0e7ff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"47.5\" y=\"42.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">Exp.<\/text><rect x=\"75.0\" y=\"20.0\" width=\"80.0\" height=\"34.0\" rx=\"0\" fill=\"#e0e7ff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"115.0\" y=\"42.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">[A] (M)<\/text><rect x=\"155.0\" y=\"20.0\" width=\"80.0\" height=\"34.0\" rx=\"0\" fill=\"#e0e7ff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"195.0\" y=\"42.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">[B] (M)<\/text><rect x=\"235.0\" y=\"20.0\" width=\"110.0\" height=\"34.0\" rx=\"0\" fill=\"#e0e7ff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"290.0\" y=\"42.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">Rate (M/s)<\/text><rect x=\"20.0\" y=\"54.0\" width=\"55.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"47.5\" y=\"76.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">1<\/text><rect x=\"75.0\" y=\"54.0\" width=\"80.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"115.0\" y=\"76.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">0.10<\/text><rect x=\"155.0\" y=\"54.0\" width=\"80.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"195.0\" y=\"76.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">0.10<\/text><rect x=\"235.0\" y=\"54.0\" width=\"110.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"290.0\" y=\"76.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">2.0 × 10⁻³<\/text><rect x=\"20.0\" y=\"88.0\" width=\"55.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"47.5\" y=\"110.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">2<\/text><rect x=\"75.0\" y=\"88.0\" width=\"80.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"115.0\" y=\"110.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">0.20<\/text><rect x=\"155.0\" y=\"88.0\" width=\"80.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"195.0\" y=\"110.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">0.10<\/text><rect x=\"235.0\" y=\"88.0\" width=\"110.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"290.0\" y=\"110.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">4.0 × 10⁻³<\/text><rect x=\"20.0\" y=\"122.0\" width=\"55.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"47.5\" y=\"144.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">3<\/text><rect x=\"75.0\" y=\"122.0\" width=\"80.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"115.0\" y=\"144.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">0.10<\/text><rect x=\"155.0\" y=\"122.0\" width=\"80.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"195.0\" y=\"144.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">0.20<\/text><rect x=\"235.0\" y=\"122.0\" width=\"110.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.4\" /><text x=\"290.0\" y=\"144.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">8.0 × 10⁻³<\/text><\/svg>", "o": ["rate = k[A][B]²; k = 2.0 M⁻² s⁻¹", "rate = k[A][B]; k = 0.2 M⁻¹ s⁻¹", "rate = k[A]²[B]; k = 20 M⁻² s⁻¹", "rate = k[A]²[B]²; k = 200 M⁻³ s⁻¹"], "s": "Exp 1→2: [A] doubles, rate doubles ⇒ order in A = 1. Exp 1→3: [B] doubles, rate ×4 ⇒ order in B = 2. Rate = k[A][B]²; k = 2.0×10⁻³/(0.10 × 0.10²) = <b>2.0 M⁻² s⁻¹<\/b>.", "a": 0}, {"sub": "Chemistry", "ch": "Ionic Equilibrium", "d": "M", "q": "A buffer is prepared by mixing 0.10 M acetic acid and 0.05 M sodium acetate (pKₐ of acetic acid = 4.76; log 2 = 0.30). The pH of the buffer is:", "f": "<svg viewBox=\"0 0 320 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><path d=\"M110 40 L110 150 Q110 170 130 170 L190 170 Q210 170 210 150 L210 40\" fill=\"#e0f2fe\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><rect x=\"112.0\" y=\"70.0\" width=\"96.0\" height=\"98.0\" rx=\"0\" fill=\"#bae6fd\" stroke=\"none\" stroke-width=\"0\" /><text x=\"160.0\" y=\"105.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"10\" font-weight=\"700\">0.10 M CH₃COOH<\/text><text x=\"160.0\" y=\"125.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"10\" font-weight=\"700\">0.05 M CH₃COONa<\/text><text x=\"160.0\" y=\"22.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"11\" font-weight=\"700\">pKₐ (acetic acid) = 4.76<\/text><text x=\"160.0\" y=\"195.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">log 2 = 0.30<\/text><\/svg>", "o": ["3.88", "4.46", "5.06", "4.76"], "s": "Henderson–Hasselbalch: pH = pKₐ + log([salt]/[acid]) = 4.76 + log(0.05/0.10) = 4.76 − 0.30 = <b>4.46<\/b>.", "a": 1}, {"sub": "Chemistry", "ch": "Electrochemistry", "d": "E", "q": "For the Daniell cell shown (E°cell = 1.10 V, n = 2, F = 96 500 C mol⁻¹), the standard Gibbs energy change ΔG° of the cell reaction is:", "f": "<svg viewBox=\"0 0 340 140\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><text x=\"170.0\" y=\"50.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"13\" font-weight=\"700\">Zn(s) | Zn²⁺(1 M) ‖ Cu²⁺(1 M) | Cu(s)<\/text><text x=\"170.0\" y=\"85.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"14\" font-weight=\"700\">E°cell = 1.10 V<\/text><text x=\"170.0\" y=\"120.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"12\">n = 2, F = 96 500 C mol⁻¹<\/text><\/svg>", "o": ["−424.6 kJ mol⁻¹", "−106.2 kJ mol⁻¹", "−212.3 kJ mol⁻¹", "+212.3 kJ mol⁻¹"], "s": "ΔG° = −nFE° = −2 × 96 500 × 1.10 = −212 300 J = <b>−212.3 kJ mol⁻¹<\/b> (negative: spontaneous).", "a": 2}, {"sub": "Chemistry", "ch": "Thermodynamics", "d": "M", "q": "For a reaction with ΔH = +30 kJ mol⁻¹ and ΔS = +100 J K⁻¹ mol⁻¹ (both independent of T), the variation of ΔG with temperature is shown. The reaction becomes spontaneous:", "f": "<svg viewBox=\"0 0 380 235\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"60.0\" y1=\"120.0\" x2=\"348.0\" y2=\"120.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"60.0\" y1=\"160.0\" x2=\"60.0\" y2=\"12.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"348.0\" y=\"112.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\"><\/text><text x=\"66.0\" y=\"16.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">ΔG (kJ)<\/text><line x1=\"195.0\" y1=\"117.0\" x2=\"195.0\" y2=\"123.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"195.0\" y=\"144.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">300<\/text><line x1=\"330.0\" y1=\"117.0\" x2=\"330.0\" y2=\"123.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"330.0\" y=\"144.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">600<\/text><line x1=\"60.0\" y1=\"52.5\" x2=\"330.0\" y2=\"187.5\" stroke=\"#e11d48\" stroke-width=\"2.6\"/><circle cx=\"195.0\" cy=\"120.0\" r=\"4.5\" fill=\"#1e293b\"/><text x=\"195.0\" y=\"112.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">T = ?<\/text><text x=\"54.0\" y=\"56.5\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">+30<\/text><text x=\"348.0\" y=\"112.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">T (K)<\/text><\/svg>", "o": ["below 300 K", "at all temperatures", "at no temperature", "above 300 K"], "s": "ΔG = ΔH − TΔS = 30 000 − 100 T. ΔG = 0 at T = 300 K. For T &gt; 300 K, ΔG &lt; 0 ⇒ <b>spontaneous above 300 K<\/b> (entropy-driven).", "a": 3}, {"sub": "Chemistry", "ch": "Solutions", "d": "E", "q": "A 0.1 M aqueous glucose solution is separated from pure water by a semipermeable membrane at 300 K as shown. The osmotic pressure of the solution is nearly:", "f": "<svg viewBox=\"0 0 360 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><polyline points=\"110.0,30.0 110.0,150.0 190.0,150.0 190.0,30.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"150.0\" y1=\"100.0\" x2=\"150.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"3\" stroke-dasharray=\"3 3\"/><rect x=\"112.0\" y=\"100.0\" width=\"36.0\" height=\"48.0\" rx=\"0\" fill=\"#e0f2fe\" stroke=\"none\" stroke-width=\"0\" /><rect x=\"152.0\" y=\"100.0\" width=\"36.0\" height=\"48.0\" rx=\"0\" fill=\"#fef3c7\" stroke=\"none\" stroke-width=\"0\" /><text x=\"130.0\" y=\"130.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"10\">water<\/text><text x=\"170.0\" y=\"124.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"9\" font-weight=\"700\">0.1 M<\/text><text x=\"170.0\" y=\"136.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"8\" font-weight=\"700\">glucose<\/text><text x=\"150.0\" y=\"168.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\">semipermeable membrane<\/text><text x=\"260.0\" y=\"80.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"11\" font-weight=\"700\">T = 300 K<\/text><text x=\"260.0\" y=\"98.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\">R = 0.0821 L atm K⁻¹ mol⁻¹<\/text><\/svg>", "o": ["1.23 atm", "0.246 atm", "24.6 atm", "2.46 atm"], "s": "π = CRT = 0.1 × 0.0821 × 300 = <b>2.46 atm<\/b> (glucose does not dissociate, i = 1).", "a": 3}, {"sub": "Chemistry", "ch": "Chemical Bonding", "d": "E", "q": "The shape of SF₄ is shown (see-saw, with the lone pair in an equatorial position). The hybridisation of sulphur and the number of lone pairs on it are:", "f": "<svg viewBox=\"0 0 330 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"170.0\" y1=\"100.0\" x2=\"170.0\" y2=\"35.0\" stroke=\"#1e293b\" stroke-width=\"2.2\"/><circle cx=\"170.0\" cy=\"35.0\" r=\"12\" fill=\"#dcfce7\" stroke=\"#059669\" stroke-width=\"1.6\"/><text x=\"170.0\" y=\"39.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">F<\/text><line x1=\"170.0\" y1=\"100.0\" x2=\"170.0\" y2=\"165.0\" stroke=\"#1e293b\" stroke-width=\"2.2\"/><circle cx=\"170.0\" cy=\"165.0\" r=\"12\" fill=\"#dcfce7\" stroke=\"#059669\" stroke-width=\"1.6\"/><text x=\"170.0\" y=\"169.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">F<\/text><line x1=\"170.0\" y1=\"100.0\" x2=\"235.0\" y2=\"115.0\" stroke=\"#1e293b\" stroke-width=\"2.2\"/><circle cx=\"235.0\" cy=\"115.0\" r=\"12\" fil e<\/text><line x1=\"69.0\" y1=\"42.0\" x2=\"96.0\" y2=\"42.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"83.0\" y=\"18.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"9\">Cl₂, hν<\/text><rect x=\"98.0\" y=\"25.0\" width=\"40.0\" height=\"34.0\" rx=\"6\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.6\" /><text x=\"118.0\" y=\"46.5\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"13\" font-weight=\"700\">A<\/text><line x1=\"140.0\" y1=\"42.0\" x2=\"167.0\" y2=\"42.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"153.0\" y=\"18.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"9\">KCN<\/text><rect x=\"169.0\" y=\"25.0\" width=\"40.0\" height=\"34.0\" rx=\"6\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.6\" /><text x=\"189.0\" y=\"46.5\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"13\" font-weight=\"700\">B<\/text><line x1=\"211.0\" y1=\"42.0\" x2=\"238.0\" y2=\"42.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"225.0\" y=\"18.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"9\">H₃O⁺, Δ<\/text><rect x=\"240.0\" y=\"25.0\" width=\"40.0\" height=\"34.0\" rx=\"6\" fill=\"#fef3c7\" stroke=\"#e11d48\" stroke-width=\"1.6\" /><text x=\"260.0\" y=\"46.5\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"13\" font-weight=\"700\">C<\/text><\/svg>", "o": ["benzoic acid", "2-phenylethanol", "phenylacetamide", "phenylacetic acid"], "s": "Cl₂/hν chlorinates the side chain: A = benzyl chloride; KCN (S<sub>N<\/sub>2): B = benzyl cyanide C₆H₅CH₂CN; hydrolysis of the nitrile: C = <b>phenylacetic acid<\/b>, C₆H₅CH₂COOH.", "a": 3}, {"sub": "Chemistry", "ch": "Organic Chemistry", "d": "M", "q": "Ethanol is labelled with its three types of hydrogen (Hₐ: CH₃, H_b: CH₂, H_c: OH). The number of signals in its high-resolution ¹H NMR spectrum is:", "f": "<svg viewBox=\"0 0 400 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sa >. Zn/H₂O prevents oxidation to acids.", "a": 3}, {"sub": "Chemistry", "ch": "Aldehydes & Ketones", "d": "M", "q": "A compound X (C₃H₆O) gives a silver mirror with Tollens’ reagent but does not give a yellow precipitate in the iodoform test. X is:", "f": "<svg viewBox=\"0 0 340 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><rect x=\"10.0\" y=\"70.0\" width=\"76.0\" height=\"40.0\" rx=\"6\" fill=\"#eef2ff\" stroke=\"#4f46e5\" stroke-width=\"1.6\" /><text x=\"48.0\" y=\"86.8\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">Compound X<\/text><text x=\"48.0\" y=\"100.8\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\" font-weight=\"700\">C₃H₆O<\/text><line x1=\"88.0\" y1=\"90.0\" x2=\"130.0\" y2=\"55.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"88.0\" y1=\"90.0\" x2=\"130.0\" y2=\"125.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"132.0\" y=\"35.0\" width=\"120.0\" height=\"40.0\" rx=\"6\" fill=\"#dcfce7\" stroke=\"#059669\" stroke-width=\"1.6\" /><text x=\"192.0\" y=\"51.9\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">Tollens’ reagent:<\/text><text x=\"192.0\" y=\"65.8\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">silver mirror (+)<\/text><rect x=\"132.0\" y=\"105.0\" width=\"120.0\" height=\"40.0\" rx=\"6\" fill=\"#fee2e2\" stroke=\"#e11d48\" stroke-width=\"1.6\" /><text x=\"192.0\" y=\"122.2\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"9\">Iodoform test<\/text><text x=\"192.0\" y=\"134.2\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"9\">(NaOH/I₂): no yellow ppt (−)<\/text><text x=\"260.0\" y=\"90.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"14\" font-weight=\"700\">X = ?<\/text><\/svg>", "o": ["propanal", "methoxyethene", "prop-2-en-1-ol", "propanone"], "s": "A silver mirror shows an aldehyde: <b>propanal, CH₃CH₂CHO<\/b> (C₃H₆O). It has no CH ub": "Chemistry", "ch": "d-Block Elements", "d": "E", "q": "The orbital diagram of a manganese atom (Z = 25) is shown. The number of unpaired electrons in the Mn²⁺ ion is:", "f": "<svg viewBox=\"0 0 300 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><text x=\"10.0\" y=\"40.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">3d<\/text><rect x=\"40.0\" y=\"28.0\" width=\"26.0\" height=\"22.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"53.0\" y1=\"46.0\" x2=\"53.0\" y2=\"30.0\" stroke=\"#e11d48\" stroke-width=\"1.6\" marker-end=\"url(#arr)\"/><rect x=\"68.0\" y=\"28.0\" width=\"26.0\" height=\"22.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"81.0\" y1=\"46.0\" x2=\"81.0\" y2=\"30.0\" stroke=\"#e11d48\" stroke-width=\"1.6\" marker-end=\"url(#arr)\"/><rect x=\"96.0\" y=\"28.0\" width=\"26.0\" height=\"22.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"109.0\" y1=\"46.0\" x2=\"109.0\" y2=\"30.0\" stroke=\"#e11d48\" stroke-width=\"1.6\" marker-end=\"url(#arr)\"/><rect x=\"124.0\" y=\"28.0\" width=\"26.0\" height=\"22.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"137.0\" y1=\"46.0\" x2=\"137.0\" y2=\"30.0\" stroke=\"#e11d48\" stroke-width=\"1.6\" marker-end=\"url(#arr)\"/><rect x=\"152.0\" y=\"28.0\" width=\"26.0\" height=\"22.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"165.0\" y1=\"46.0\" x2=\"165.0\" y2=\"30.0\" stroke=\"#e11d48\" stroke-width=\"1.6\" marker-end=\"url(#arr)\"/><text x=\"10.0\" y=\"90.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">4s<\/text><rect x=\"40.0\" y=\"78.0\" width=\"26.0\" height=\"22.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"48.0\" y1=\"96.0\" x2=\"48.0\" y2=\"80.0\" stroke=\"#e11d48\" stroke-width=\"1.6\" marker- ><line x1=\"115.0\" y1=\"95.0\" x2=\"156.0\" y2=\"125.0\" stroke=\"#1e293b\" stroke-width=\"1.8\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"168.0\" y=\"134.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"13\" font-weight=\"700\">d = ?<\/text><\/svg>", "o": [], "t": "n", "a": 3, "tol": 0.011, "s": "Distance between ax + by + c₁ = 0 and ax + by + c₂ = 0 is |c₁ − c₂|/√(a² + b²) = |−5 − (−20)|/√(9 + 16) = 15/5 = <b>3<\/b>.", "unit": ""}, {"sub": "Mathematics", "ch": "Permutations & Combinations", "d": "E", "q": "Ten distinct points lie on a circle (figure). The number of triangles that can be formed using any three of these points as vertices is:", "f": "<svg viewBox=\"0 0 300 195\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><circle cx=\"150.0\" cy=\"100.0\" r=\"70\" fill=\"#f8fafc\" stroke=\"#1e293b\" stroke-width=\"1.8\"/><circle cx=\"150.0\" cy=\"30.0\" r=\"5\" fill=\"#e11d48\"/><circle cx=\"191.1\" cy=\"43.4\" r=\"5\" fill=\"#e11d48\"/><circle cx=\"216.6\" cy=\"78.4\" r=\"5\" fill=\"#e11d48\"/><circle cx=\"216.6\" cy=\"121.6\" r=\"5\" fill=\"#e11d48\"/><circle cx=\"191.1\" cy=\"156.6\" r=\"5\" fill=\"#e11d48\"/><circle cx=\"150.0\" cy=\"170.0\" r=\"5\" fill=\"#e11d48\"/><circle cx=\"108.9\" cy=\"156.6\" r=\"5\" fill=\"#e11d48\"/><circle cx=\"83.4\" cy=\"121.6\" r=\"5\" fill=\"#e11d48\"/><circle cx=\"83.4\" cy=\"78.4\" r=\"5\" fill=\"#e11d48\"/><circle cx=\"108.9\" cy=\"43.4\" r=\"5\" fill=\"#e11d48\"/><text x=\"150.0\" y=\"104.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"12\" font-weight=\"700\">10 points<\/text><text x=\"150.0\" y=\"186.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">No three of them are collinear<\/text><\/svg>", "o": [], "t": "n", "a": 120, "tol": 0.011, "s": "Any 3 points on a circle are non-collinear, so the number of triangles = C(10, 3) = (10·9·8)/(3·2·1) = <b>120<\/b>.", "unit": ""}]};

<script>
(function(){
var T=window.TEST,Q=T.questions,N=Q.length,LS='vca_'+T.id,st=null,tick=null,L='ABCD';
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){try{var s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function has(i){var a=st.ans[i];return typeof a==='string'?a!=='':a>=0}
function isOk(i){var q=Q[i],a=st.ans[i];if(!has(i))return false;if(q.t==='n'){var v=parseFloat(a);return !isNaN(v)&&Math.abs(v-q.a)<=(q.tol||0.011)}return a===q.a}
function mmss(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return(m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function show(id){['start','exam','res'].forEach(function(k){$(k).classList.toggle('hide',k!==id)});window.scrollTo(0,0)}
function modal(t,b,btns){$('mt').textContent=t;$('mb').innerHTML=b;var r=$('mr');r.innerHTML='';btns.forEach(function(x){var e=document.createElement('button');e.className='btn sm '+(x.c||'');e.textContent=x.t;e.onclick=function(){$('modal').classList.remove('on');x.f&&x.f()};r.appendChild(e)});$('modal').classList.add('on')}

/* ---------- start screen ---------- */
document.title=T.title+' | VCA EduTech & AI';
$('ttl').textContent=T.title;$('badge').textContent=T.badge;$('h1').textContent=T.title;$('sub').innerHTML=T.subtitle;
$('stats').innerHTML=T.stats.map(function(s){return'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join('');
$('rules').innerHTML=T.rules.map(function(r){return'<li>'+r+'</li>'}).join('');
var old=load();if(old&&!old.done){$('resume').classList.remove('hide');$('nm').value=old.name||''}
if(old&&old.done){$('resume').classList.remove('hide');$('resume').textContent='See my last result'}
$('go').onclick=function(){var n=$('nm').value.trim();if(!n){$('nm').focus();$('nm').style.borderColor='#dc2626';return}
 var seed=Math.floor(Math.random()*1e9),r=rng(seed),perm=Q.map(function(){var p=[0,1,2,3];for(var i=3;i>0;i--){var j=Math.floor(r()*(i+1)),t=p[i];p[i]=p[j];p[j]=t}return p});
 st={name:n,seed:seed,perm:perm,start:Date.now(),end:Date.now()+T.minutes*60000,cur:0,ans:Q.map(function(){return-1}),stat:Q.map(function(){return 0}),spent:Q.map(function(){return 0}),done:false};
 st.stat[0]=1;save();begin()};
$('resume').onclick=function(){st=old;if(st.done){result()}else{begin()}};
$('nm').oninput=function(){this.style.borderColor=''};

/* ---------- exam ---------- */
var lastT=0;
function begin(){show('exam');$('timer').classList.remove('hide');$('cand').textContent='Candidate: '+st.name;lastT=Date.now();buildTabs();draw();clearInterval(tick);tick=setInterval(clock,1000);clock()}
function clock(){var left=Math.round((st.end-Date.now())/1000);$('timer').textContent=mmss(left);$('timer').classList.toggle('low',left<300);if(left<=0){clearInterval(tick);finish(true)}}
function subjects(){var o=[],s={};Q.forEach(function(q,i){var k=q.sub||T.subject;if(!s[k]){s[k]=1;o.push({n:k,first:i})}});return o}
function buildTabs(){var S=subjects();$('tabs').innerHTML='';if(S.length<2){$('tabs').classList.add('hide');return}$('tabs').classList.remove('hide');S.forEach(function(s){var b=document.createElement('button');b.className='tab';b.textContent=s.n;b.dataset.f=s.first;b.onclick=function(){go(s.first)};$('tabs').appendChild(b)})}
function spend(){var n=Date.now();st.spent[st.cur]+=Math.round((n-lastT)/1000);lastT=n}
function go(i){if(i<0||i>=N)return;spend();st.cur=i;if(st.stat[i]===0)st.stat[i]=1;save();draw();$('pal').classList.remove('open');window.scrollTo(0,0)}
function draw(){
 var i=st.cur,q=Q[i],perm=st.perm[i];
 var S=subjects(),mine=q.sub||T.subject;[].forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.textContent===mine)});
 var dm={E:'Easy',M:'Medium',H:'Hard'};
 $('qh').innerHTML='<span class="qn">Q'+(i+1)+'</span><span>of '+N+'</span><span class="tag">'+esc(q.ch)+'</span><span class="tag '+q.d+'">'+dm[q.d]+'</span>'+(q.t==='n'?'<span class="tag" style="background:#fae8ff;color:#86198f">Numerical</span>':'')+'<span class="mk"><i>+'+T.pos+'</i> / <u>'+(q.t==='n'?(T.negN===undefined?T.neg:T.negN):T.neg)+'</u></span>';
 $('qt').innerHTML=q.q;
 if(q.f){$('fig').innerHTML=q.f;$('fig').classList.remove('hide')}else{$('fig').classList.add('hide');$('fig').innerHTML=''}
 $('opts').innerHTML='';
 if(q.t==='n'){var w=document.createElement('div');w.innerHTML='<div style="font-size:14px;color:#64748b;margin-bottom:6px">Type your answer (a number; round to 2 decimal places if needed)</div><input id="num" class="inp" inputmode="decimal" autocomplete="off" placeholder="Enter numerical value" style="max-width:280px;font-size:20px;font-weight:700">';$('opts').appendChild(w);var inp=w.querySelector('input');inp.value=has(i)?st.ans[i]:'';inp.oninput=function(){var v=inp.value.trim();st.ans[i]=/^-?\d*\.?\d*$/.test(v)&&v!==''&&v!=='-'&&v!=='.'?v:-1;save();pal()}}
 else perm.forEach(function(orig,k){var b=document.createElement('button');b.className='opt'+(st.ans[i]===orig?' sel':'');b.innerHTML='<span class="k">'+L[k]+'</span><span>'+q.o[orig]+'</span>';b.onclick=function(){st.ans[i]=(st.ans[i]===orig?-1:orig);save();draw()};$('opts').appendChild(b)});
 $('prev').disabled=i===0;$('next').textContent=i===N-1?'Save':'Save & next →';
 pal();
}
function pal(){var g=$('grid');g.innerHTML='';var c=[0,0,0,0,0];
 for(var i=0;i<N;i++){var s=st.stat[i];if(s===0&&i===st.cur)s=1;c[s]++;var b=document.createElement('button');b.className='pb s'+s+(i===st.cur?' cur':'');b.textContent=i+1;(function(i){b.onclick=function(){go(i)}})(i);g.appendChild(b)}
 $('cnt').innerHTML='Answered: <b>'+(c[2]+c[4])+'</b> · Not answered: <b>'+c[1]+'</b> · Marked: <b>'+(c[3]+c[4])+'</b> · Not visited: <b>'+c[0]+'</b>'}
function setStat(i,marked){var a=has(i);st.stat[i]=marked?(a?4:3):(a?2:1)}
$('next').onclick=function(){setStat(st.cur,false);save();if(st.cur<N-1)go(st.cur+1);else draw()};
$('mark').onclick=function(){setStat(st.cur,true);save();if(st.cur<N-1)go(st.cur+1);else draw()};
$('clr').onclick=function(){st.ans[st.cur]=-1;setStat(st.cur,st.stat[st.cur]>=3);save();draw()};
$('prev').onclick=function(){go(st.cur-1)};
$('palbtn').onclick=function(){$('pal').classList.toggle('open')};
$('sub1').onclick=function(){var a=Q.filter(function(q,i){return has(i)}).length;modal('Submit the test?','You have answered <b>'+a+'</b> of <b>'+N+'</b> questions. <b>'+(N-a)+'</b> are unattempted. Once submitted you cannot change answers.',[{t:'Keep going',c:'ghost'},{t:'Submit now',f:function(){finish(false)}}])};
document.addEventListener('keydown',function(e){if(e.target&&e.target.tagName==='INPUT')return;if($('exam').classList.contains('hide')||$('modal').classList.contains('on'))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(Q[st.cur].t==='n')return;var k='1234'.indexOf(e.key);if(k<0)k='abcd'.indexOf(e.key.toLowerCase());if(k>=0){var o=st.perm[st.cur][k];st.ans[st.cur]=(st.ans[st.cur]===o?-1:o);save();draw()}});

/* ---------- result ---------- */
function finish(auto){spend();clearInterval(tick);st.done=true;st.endedAt=Date.now();save();$('timer').classList.add('hide');result(auto)}
function calc(){var r={c:0,w:0,u:0,sc:0,by:{}};Q.forEach(function(q,i){var k=q.sub||T.subject;r.by[k]=r.by[k]||{c:0,w:0,u:0,sc:0,n:0};var b=r.by[k];b.n++;var ng=q.t==='n'?(T.negN===undefined?T.neg:T.negN):T.neg;if(!has(i)){r.u++;b.u++}else if(isOk(i)){r.c++;b.c++;r.sc+=T.pos;b.sc+=T.pos}else{r.w++;b.w++;r.sc+=ng;b.sc+=ng}});return r}
function result(auto){
 show('res');var r=calc(),max=N*T.pos,pct=Math.max(0,Math.round(r.sc/max*100)),att=r.c+r.w,acc=att?Math.round(r.c/att*100):0,tm=Math.round(((st.endedAt||Date.now())-st.start)/1000);
 var col=pct>=70?'#16a34a':pct>=40?'#f59e0b':'#ef4444';
 var msg=pct>=70?'Outstanding! You are performing at a high level. Now prove it in more full tests.':pct>=40?'Good base. A few weak chapters are holding your score back — see the analysis below and fix them.':'This test just showed you exactly where to improve. Every topper starts with an honest score. Review the solutions below.';
 var h='<div class="card"><div class="score"><div class="ring" style="--p:'+pct+';--c:'+col+'"><div><div><b>'+r.sc+'</b><br><span>out of '+max+'</span></div></div></div><div><h2 style="margin:0 0 4px">'+esc(st.name)+', here is your result'+(auto?' (time up)':'')+'</h2><div style="color:#475569">'+msg+'</div><div class="kpis"><div class="kpi"><b style="color:#16a34a">'+r.c+'</b><span>Correct</span></div><div class="kpi"><b style="color:#dc2626">'+r.w+'</b><span>Wrong</span></div><div class="kpi"><b style="color:#f59e0b">'+r.u+'</b><span>Unattempted</span></div><div class="kpi"><b>'+acc+'%</b><span>Accuracy</span></div></div></div></div>';
 h+='<div style="margin-top:14px"><b>Subject-wise performance</b>';
 Object.keys(r.by).forEach(function(k){var b=r.by[k],p=Math.max(0,Math.round(b.sc/(b.n*T.pos)*100));h+='<div class="subrow"><span>'+esc(k)+'</span><div class="meter"><div style="width:'+p+'%"></div></div><span>'+b.sc+'/'+b.n*T.pos+'</span></div>'});
 h+='<div style="font-size:13px;color:#64748b">Time taken: '+Math.floor(tm/60)+' min '+tm%60+' s &nbsp;·&nbsp; Average '+Math.round(tm/N)+' s per question</div></div>';
 var chap={};Q.forEach(function(q,i){if(!isOk(i)){chap[q.ch]=(chap[q.ch]||0)+1}});var wk=Object.keys(chap).sort(function(a,b){return chap[b]-chap[a]}).slice(0,4);
 if(wk.length)h+='<div style="margin-top:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;font-size:14px"><b>Revise first:</b> '+wk.map(esc).join(' · ')+'</div>';
 var share='I scored '+r.sc+'/'+max+' in the VCA CBT test by VS Sir. Can you beat my score? Try it free: '+T.shareUrl;
 h+='<div class="row"><a class="btn sm" style="text-decoration:none;background:#16a34a;box-shadow:none" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Challenge a friend on WhatsApp</a><button class="btn sm ghost" id="again">Retake this test</button></div></div>';
 h+=T.cta;
 h+='<div class="card" style="margin-top:14px"><div class="row" style="margin:0 0 6px"><h3 style="margin:0;flex:1">Review answers &amp; solutions</h3><button class="btn sm ghost f on" data-f="all">All</button><button class="btn sm ghost f" data-f="no">Wrong</button><button class="btn sm ghost f" data-f="sk">Skipped</button><button class="btn sm ghost f" data-f="ok">Correct</button></div><div id="rv"></div></div>';
 $('res').innerHTML=h;
 $('again').onclick=function(){try{localStorage.removeItem(LS)}catch(e){}location.reload()};
 var fl='all';function rv(){var o='';Q.forEach(function(q,i){var a=st.ans[i],k=!has(i)?'sk':(isOk(i)?'ok':'no');var ng=q.t==='n'?(T.negN===undefined?T.neg:T.negN):T.neg;if(fl!=='all'&&fl!==k)return;
  o+='<div class="rv '+k+'"><div class="qh"><span class="qn">Q'+(i+1)+'</span><span class="tag">'+esc(q.ch)+'</span><span style="margin-left:auto;font-weight:700;color:'+(k==='ok'?'#16a34a':k==='no'?'#dc2626':'#b45309')+'">'+(k==='ok'?'Correct +'+T.pos:k==='no'?'Wrong '+ng:'Skipped 0')+'</span></div><div class="qt" style="font-size:16px">'+q.q+'</div>'+(q.f?'<div class="fig">'+q.f+'</div>':'');
  if(q.t==='n'){o+='<div class="o c"><b>Correct answer:</b> '+q.a+' &nbsp;✔</div><div class="o'+(k==='no'?' w':'')+'"><b>Your answer:</b> '+(has(i)?esc(a):'not attempted')+'</div>'}
  else st.perm[i].forEach(function(orig,kk){var c=orig===q.a?' c':(orig===a?' w':'');o+='<div class="o'+c+'"><b>'+L[kk]+'.</b> '+q.o[orig]+(orig===q.a?' &nbsp;✔':'')+(orig===a&&a!==q.a?' &nbsp;✘ your answer':'')+'</div>'});
  o+='<div class="sol"><b>Solution:</b> '+q.s+'</div></div>'});$('rv').innerHTML=o||'<p>Nothing to show here.</p>'}
 rv();[].forEach.call(document.querySelectorAll('.f'),function(b){b.onclick=function(){fl=b.dataset.f;[].forEach.call(document.querySelectorAll('.f'),function(x){x.classList.toggle('on',x===b)});rv()}});
}
})();
</script>
