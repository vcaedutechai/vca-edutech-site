-size=\"12\" font-weight=\"700\">D = 1 m<\/text><line x1=\"88.0\" y1=\"85.0\" x2=\"88.0\" y2=\"115.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"84.0\" y=\"100.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">d = 1 mm<\/text><text x=\"340.0\" y=\"6.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">screen<\/text><text x=\"352.0\" y=\"104.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">O<\/text><\/svg>", "o": ["1.0 mm", "0.5 mm", "2.0 mm", "1.5 mm"], "s": "Fringe width β = λD/d = (500×10⁻⁹ × 1)/(10⁻³) = 0.5 mm. y₃ = 3β = <b>1.5 mm<\/b>.", "a": 3, "sub": "Physics"}, {"ch": "Dual Nature of Matter", "d": "M", "q": "The graph shows the maximum kinetic energy of photoelectrons versus frequency of incident light for a metal. Using h = 4.14×10⁻¹⁵ eV·s, the work function of the metal is nearly:", "f": "<svg viewBox=\"0 0 390 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"55.0\" y1=\"160.0\" x2=\"363.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"55.0\" y1=\"160.0\" x2=\"55.0\" y2=\"22.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"363.0\" y=\"152.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">ν (10¹⁴ Hz)<\/text><text x=\"61.0\" y=\"26.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">K_max (eV)<\/text><line x1=\"175.8\" y1=\"157.0\" x2=\"175.8\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"175.8\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">5<\/text><line x1=\"296.7\" y1=\"157.0\" x2=\"296.7\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"296.7\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">10<\/text><line x1=\"52.0\" y1=\"77.2\" x2=\"58.0\" y2=\"77.2\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"49.0\" y=\"81.2\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">2.07<\/text><polyline points=\"175.8,160.0 320.8,60.6\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><line x1=\"296.7\" y1=\"77.2\" x2=\"296.7\" y2=\"160.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"296.7\" y1=\"77.2\" x2=\"55.0\" y2=\"77.2\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><circle cx=\"175.8\" cy=\"160.0\" r=\"3.5\" fill=\"#e11d48\"/><circle cx=\"296.7\" cy=\"77.2\" r=\"3.5\" fill=\"#e11d48\"/><\/svg>", "o": ["1.24 eV", "2.07 eV", "3.10 eV", "4.14 eV"], "s": "The x-intercept is the threshold frequency ν₀ = 5×10¹⁴ Hz. φ = hν₀ = 4.14×10⁻¹⁵ × 5×10¹⁴ = <b>2.07 eV<\/b>.", "a": 1, "sub": "Physics"}, {"ch": "Atoms", "d": "M", "q": "The energy-level diagram of a hydrogen atom is shown with four emission transitions P, Q, R and S. Which transition emits a photon of energy 10.2 eV?", "f": "<svg viewBox=\"0 0 330 222\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"90.0\" y1=\"190.0\" x2=\"230.0\" y2=\"190.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><text x=\"84.0\" y=\"194.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">n = 1<\/text><text x=\"236.0\" y=\"194.0\" text-anchor=\"start\" fill=\"#94a3b8\" font-size=\"11\">-13.6 eV<\/text><line x1=\"90.0\" y1=\"130.0\" x2=\"230.0\" y2=\"130.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><text x=\"84.0\" y=\"134.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">n = 2<\/text><text x=\"236.0\" y=\"134.0\" text-anchor=\"start\" fill=\"#94a3b8\" font-size=\"11\">-3.4 eV<\/text><line x1=\"90.0\" y1=\"92.0\" x2=\"230.0\" y2=\"92.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><text x=\"84.0\" y=\"96.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">n = 3<\/text><text x=\"236.0\" y=\"96.0\" text-anchor=\"start\" fill=\"#94a3b8\" font-size=\"11\">-1.51 eV<\/text><line x1=\"90.0\" y1=\"66.0\" x2=\"230.0\" y2=\"66.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><text x=\"84.0\" y=\"70.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">n = 4<\/text><text x=\"236.0\" y=\"70.0\" text-anchor=\"start\" fill=\"#94a3b8\" font-size=\"11\">-0.85 eV<\/text><line x1=\"90.0\" y1=\"36.0\" x2=\"230.0\" y2=\"36.0\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><text x=\"84.0\" y=\"40.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">n = ∞<\/text><text x=\"236.0\" y=\"40.0\" text-anchor=\"start\" fill=\"#94a3b8\" font-size=\"11\">0 eV<\/text><text x=\"160.0\" y=\"214.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">(levels not drawn to scale)<\/text><line x1=\"110.0\" y1=\"92.0\" x2=\"110.0\" y2=\"186.0\" stroke=\"#4f46e5\" stroke-width=\"2\" marker-end=\"url(#arb)\"/><text x=\"118.0\" y=\"106.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"13\" font-weight=\"700\">P<\/text><line x1=\"140.0\" y1=\"130.0\" x2=\"140.0\" y2=\"186.0\" stroke=\"#4f46e5\" stroke-width=\"2\" marker-end=\"url(#arb)\"/><text x=\"148.0\" y=\"144.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"13\" font-weight=\"700\">Q<\/text><line x1=\"175.0\" y1=\"66.0\" x2=\"175.0\" y2=\"126.0\" stroke=\"#4f46e5\" stroke-width=\"2\" marker-end=\"url(#arb)\"/><text x=\"183.0\" y=\"80.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"13\" font-weight=\"700\">R<\/text><line x1=\"205.0\" y1=\"92.0\" x2=\"205.0\" y2=\"126.0\" stroke=\"#4f46e5\" stroke-width=\"2\" marker-end=\"url(#arb)\"/><text x=\"213.0\" y=\"106.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"13\" font-weight=\"700\">S<\/text><\/svg>", "o": ["S", "P", "R", "Q"], "s": "ΔE = 13.6(1/n₁² − 1/n₂²). For n = 2 → 1: 13.6(1 − ¼) = 10.2 eV. Transition P (3→1) gives 12.09 eV, R (4→2) gives 2.55 eV and S (3→2) gives 1.89 eV. Answer: <b>Q<\/b>.", "a": 3, "sub": "Physics"}, {"ch": "Nuclei", "d": "M", "q": "The number of undecayed nuclei of a radioactive sample falls from N₀ to N₀/4 in 20 days, as shown in the graph. The fraction of nuclei remaining after 30 days is:", "f": "<svg viewBox=\"0 0 390 195\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"55.0\" y1=\"160.0\" x2=\"373.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"55.0\" y1=\"160.0\" x2=\"55.0\" y2=\"17.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"373.0\" y=\"152.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">t (days)<\/text><text x=\"61.0\" y=\"21.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">N<\/text><line x1=\"197.9\" y1=\"157.0\" x2=\"197.9\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"197.9\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">20<\/text><line x1=\"340.7\" y1=\"157.0\" x2=\"340.7\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"340.7\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">40<\/text><polyline points=\"55.0,46.4 62.1,54.0 69.3,61.1 76.4,67.7 83.6,73.9 90.7,79.6 97.9,85.0 105.0,90.0 112.1,94.7 119.3,99.1 126.4,103.2 133.6,107.0 140.7,110.5 147.9,113.8 155.0,116.9 162.1,119.8 169.3,122.5 176.4,125.0 183.6,127.4 190.7,129.6 197.9,131.6 205.0,133.5 212.1,135.3 219.3,136.9 226.4,138.5 233.6,139.9 240.7,141.3 247.9,142.5 255.0,143.7 262.1,144.8 269.3,145.8 276.4,146.7 283.6,147.6 290.7,148.5 297.9,149.2 305.0,150.0 312.1,150.6 319.3,151.3 326.4,151.8 333.6,152.4 340.7,152.9\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><line x1=\"197.9\" y1=\"131.6\" x2=\"197.9\" y2=\"160.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"197.9\" y1=\"131.6\" x2=\"55.0\" y2=\"131.6\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><text x=\"50.0\" y=\"50.4\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">N₀<\/text><text x=\"50.0\" y=\"135.6\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">N₀/4<\/text><circle cx=\"197.9\" cy=\"131.6\" r=\"3.5\" fill=\"#e11d48\"/><\/svg>", "o": ["1/8", "1/16", "1/6", "1/4"], "s": "N₀ → N₀/4 in 20 days means two half-lives: T½ = 10 days. 30 days = 3 half-lives, so fraction = (½)³ = <b>1/8<\/b>.", "a": 0, "sub": "Physics"}, {"ch": "Semiconductor Devices", "d": "M", "q": "In the circuit shown the diodes are ideal and the battery has negligible internal resistance (the longer plate is positive). The current drawn from the battery is:", "f": "<svg viewBox=\"0 0 390 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"34.0\" y1=\"86.0\" x2=\"34.0\" y2=\"114.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"46.0\" y1=\"92.0\" x2=\"46.0\" y2=\"108.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><text x=\"22.0\" y=\"100.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">6 V<\/text><line x1=\"34.0\" y1=\"86.0\" x2=\"34.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"34.0\" y1=\"40.0\" x2=\"85.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><rect x=\"86.0\" y=\"33.0\" width=\"52.0\" height=\"14.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><text x=\"112.0\" y=\"24.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">3 Ω<\/text><line x1=\"138.0\" y1=\"40.0\" x2=\"340.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"46.0\" y1=\"108.0\" x2=\"46.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"46.0\" y1=\"160.0\" x2=\"340.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"220.0\" y1=\"40.0\" x2=\"220.0\" y2=\"62.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><polyline points=\"211.0,64.0 229.0,64.0 220.0,80.0 211.0,64.0\" fill=\"#e2e8f0\" stroke=\"#1e293b\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"211.0\" y1=\"80.0\" x2=\"229.0\" y2=\"80.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"220.0\" y1=\"80.0\" x2=\"220.0\" y2=\"98.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><rect x=\"213.0\" y=\"101.0\" width=\"14.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"220.0\" y1=\"135.0\" x2=\"220.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"246.0\" y=\"122.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\">3 Ω<\/text><text x=\"246.0\" y=\"76.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">D₁<\/text><line x1=\"310.0\" y1=\"40.0\" x2=\"310.0\" y2=\"62.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><polyline points=\"301.0,80.0 319.0,80.0 310.0,64.0 301.0,80.0\" fill=\"#e2e8f0\" stroke=\"#1e293b\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><line x1=\"301.0\" y1=\"64.0\" x2=\"319.0\" y2=\"64.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"310.0\" y1=\"80.0\" x2=\"310.0\" y2=\"98.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><rect x=\"303.0\" y=\"101.0\" width=\"14.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"310.0\" y1=\"135.0\" x2=\"310.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"336.0\" y=\"122.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\">6 Ω<\/text><text x=\"336.0\" y=\"76.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">D₂<\/text><circle cx=\"220.0\" cy=\"40.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"310.0\" cy=\"40.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"220.0\" cy=\"160.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"310.0\" cy=\"160.0\" r=\"3\" fill=\"#1e293b\"/><text x=\"28.0\" y=\"78.0\" text-anchor=\"end\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">+<\/text><\/svg>", "o": ["2 A", "0.67 A", "1 A", "1.5 A"], "s": "D₁ is forward biased (conducts) and D₂ is reverse biased (blocks, so the 6 Ω branch is dead). Circuit: 3 Ω + 3 Ω in series = 6 Ω, I = 6/6 = <b>1 A<\/b>.", "a": 2, "sub": "Physics"}, {"ch": "Dual Nature of Matter", "d": "E", "q": "An electron is accelerated from rest through a potential difference of 100 V. Its de Broglie wavelength is nearly (h = 6.63×10⁻³⁴ J·s, m = 9.1×10⁻³¹ kg, e = 1.6×10⁻¹⁹ C):", "f": "", "o": ["0.123 Å", "0.0123 Å", "1.23 Å", "12.3 Å"], "s": "λ = h/√(2meV) = 12.27/√V Å = 12.27/10 = <b>1.23 Å<\/b>.", "a": 2, "sub": "Physics"}, {"ch": "Units & Dimensions", "d": "E", "q": "The quantity B²/μ₀ (B = magnetic field, μ₀ = permeability of free space) has the same dimensions as:", "f": "", "o": ["Energy, [ML²T⁻²]", "Force, [MLT⁻²]", "Energy per unit volume, [ML⁻¹T⁻²]", "Power, [ML²T⁻³]"], "s": "B²/2μ₀ is the magnetic energy density, so B²/μ₀ has the dimensions of energy/volume = [ML²T⁻²]/[L³] = <b>[ML⁻¹T⁻²]<\/b> (same as pressure).", "a": 2, "sub": "Physics"}, {"ch": "Relative Motion", "d": "M", "q": "A boat having speed 5 m/s in still water wants to cross a 80 m wide river flowing at 3 m/s and reach the point B directly opposite to its starting point A. The time taken to cross the river is:", "f": "<svg viewBox=\"0 0 390 175\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><rect x=\"20.0\" y=\"60.0\" width=\"340.0\" height=\"80.0\" rx=\"0\" fill=\"#bae6fd\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"20.0\" y1=\"60.0\" x2=\"360.0\" y2=\"60.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"20.0\" y1=\"140.0\" x2=\"360.0\" y2=\"140.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"60.0\" y1=\"100.0\" x2=\"95.0\" y2=\"100.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><line x1=\"190.0\" y1=\"100.0\" x2=\"225.0\" y2=\"100.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><line x1=\"300.0\" y1=\"100.0\" x2=\"335.0\" y2=\"100.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><circle cx=\"150.0\" cy=\"140.0\" r=\"4\" fill=\"#e11d48\"/><circle cx=\"150.0\" cy=\"60.0\" r=\"4\" fill=\"#e11d48\"/><text x=\"150.0\" y=\"158.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">A (start)<\/text><text x=\"150.0\" y=\"50.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">B (target, directly opposite)<\/text><line x1=\"150.0\" y1=\"140.0\" x2=\"105.0\" y2=\"80.0\" stroke=\"#e11d48\" stroke-width=\"2.4\" marker-end=\"url(#arr)\"/><text x=\"156.0\" y=\"118.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">5 m/s<\/text><line x1=\"150.0\" y1=\"140.0\" x2=\"150.0\" y2=\"66.0\" stroke=\"#059669\" stroke-width=\"1.6\" stroke-dasharray=\"5 3\"/><text x=\"318.0\" y=\"120.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">river 3 m/s<\/text><line x1=\"352.0\" y1=\"60.0\" x2=\"352.0\" y2=\"140.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"352.0\" y=\"155.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">80 m<\/text><\/svg>", "o": ["16 s", "26.7 s", "20 s", "10 s"], "s": "To go straight across, the boat heads upstream so that 5 sin θ = 3. Cross-stream speed = √(5² − 3²) = 4 m/s. Time = 80/4 = <b>20 s<\/b>.", "a": 2, "sub": "Physics"}, {"ch": "Collisions", "d": "M", "q": "A 2 kg trolley moving at 6 m/s collides with a stationary 4 kg trolley on a smooth surface and they stick together (figure). The loss of kinetic energy in the collision is:", "f": "<svg viewBox=\"0 0 350 175\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><text x=\"20.0\" y=\"18.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">Before<\/text><rect x=\"40.0\" y=\"36.0\" width=\"52.0\" height=\"30.0\" rx=\"0\" fill=\"#bfdbfe\" stroke=\"#4f46e5\" stroke-width=\"2\" /><text x=\"66.0\" y=\"56.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">2 kg<\/text><line x1=\"98.0\" y1=\"51.0\" x2=\"150.0\" y2=\"51.0\" stroke=\"#e11d48\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/><text x=\"124.0\" y=\"42.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">6 m/s<\/text><rect x=\"220.0\" y=\"32.0\" width=\"62.0\" height=\"34.0\" rx=\"0\" fill=\"#fecdd3\" stroke=\"#e11d48\" stroke-width=\"2\" /><text x=\"251.0\" y=\"54.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">4 kg<\/text><text x=\"251.0\" y=\"80.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">at rest<\/text><line x1=\"10.0\" y1=\"66.0\" x2=\"340.0\" y2=\"66.0\" stroke=\"#94a3b8\" stroke-width=\"1.4\"/><text x=\"20.0\" y=\"108.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">After (stick together)<\/text><rect x=\"150.0\" y=\"126.0\" width=\"112.0\" height=\"34.0\" rx=\"0\" fill=\"#ddd6fe\" stroke=\"#4f46e5\" stroke-width=\"2\" /><text x=\"206.0\" y=\"148.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">6 kg<\/text><line x1=\"268.0\" y1=\"143.0\" x2=\"330.0\" y2=\"143.0\" stroke=\"#e11d48\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/><text x=\"300.0\" y=\"134.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">v = ?<\/text><line x1=\"10.0\" y1=\"160.0\" x2=\"340.0\" y2=\"160.0\" stroke=\"#94a3b8\" stroke-width=\"1.4\"/><\/svg>", "o": ["24 J", "36 J", "12 J", "18 J"], "s": "Momentum: 2×6 = 6v so v = 2 m/s. KE before = ½×2×36 = 36 J; after = ½×6×4 = 12 J. Loss = <b>24 J<\/b>.", "a": 0, "sub": "Physics"}, {"ch": "System of Particles", "d": "M", "q": "Three particles of masses 1 kg, 2 kg and 3 kg are placed at (0, 0), (2 m, 0) and (0, 2 m) as shown. The coordinates of the centre of mass (in metres) are:", "f": "<svg viewBox=\"0 0 290 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"40.0\" y1=\"170.0\" x2=\"40.0\" y2=\"15.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"40.0\" y1=\"170.0\" x2=\"250.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"40.0\" y=\"12.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">y<\/text><text x=\"250.0\" y=\"186.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">x<\/text><circle cx=\"40.0\" cy=\"170.0\" r=\"9\" fill=\"#bfdbfe\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"52.0\" y=\"188.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"11\">1 kg  (0, 0)<\/text><circle cx=\"160.0\" cy=\"170.0\" r=\"11\" fill=\"#fecdd3\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"160.0\" y=\"188.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">2 kg  (2, 0)<\/text><circle cx=\"40.0\" cy=\"50.0\" r=\"13\" fill=\"#d1fae5\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"58.0\" y=\"48.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"11\">3 kg  (0, 2)<\/text><\/svg>", "o": ["(2/3, 2/3)", "(1, 2/3)", "(1, 1)", "(2/3, 1)"], "s": "x_cm = (1×0 + 2×2 + 3×0)/6 = 2/3; y_cm = (1×0 + 2×0 + 3×2)/6 = 1. So <b>(2/3, 1)<\/b>.", "a": 3, "sub": "Physics"}, {"ch": "Rotational Motion", "d": "H", "q": "A solid cylinder A and a thin hollow cylinder B of the same mass and radius roll without slipping down the same inclined plane (figure). The ratio of their accelerations a_A : a_B is:", "f": "<svg viewBox=\"0 0 350 195\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><polyline points=\"30.0,170.0 330.0,170.0 330.0,40.0 30.0,170.0\" fill=\"#f1f5f9\" stroke=\"#1e293b\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"113.7\" cy=\"116.3\" r=\"16\" fill=\"#bfdbfe\" stroke=\"#4f46e5\" stroke-width=\"2\"/><circle cx=\"113.7\" cy=\"116.3\" r=\"2\" fill=\"#4f46e5\"/><circle cx=\"213.6\" cy=\"73.0\" r=\"16\" fill=\"#fff\" stroke=\"#e11d48\" stroke-width=\"4\"/><text x=\"113.0\" y=\"92.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"11\" font-weight=\"700\">A: solid cylinder<\/text><text x=\"214.0\" y=\"46.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"11\" font-weight=\"700\">B: hollow cylinder (thin ring)<\/text><text x=\"250.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">same incline<\/text><\/svg>", "o": ["4 : 3", "3 : 4", "2 : 1", "1 : 1"], "s": "a = g sin θ /(1 + I/MR²). Solid cylinder: I/MR² = ½ → a ∝ 1/1.5 = 2/3. Hollow (ring): I/MR² = 1 → a ∝ 1/2. Ratio = (2/3)/(1/2) = <b>4 : 3<\/b>.", "a": 0, "sub": "Physics"}, {"ch": "Oscillations", "d": "M", "q": "A block of mass m is attached to two identical springs (each of force constant k) in two ways: (a) in series and (b) in parallel (figure). The ratio of the time periods T(a) : T(b) is:", "f": "<svg viewBox=\"0 0 280 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><text x=\"10.0\" y=\"20.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">(a)<\/text><line x1=\"25.0\" y1=\"30.0\" x2=\"25.0\" y2=\"80.0\" stroke=\"#1e293b\" stroke-width=\"5\"/><polyline points=\"25.0,55.0 33.4,55.0 37.8,62.0 46.7,48.0 55.6,62.0 64.4,48.0 73.3,62.0 82.2,48.0 86.6,55.0 95.0,55.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polyline points=\"95.0,55.0 103.4,55.0 107.8,62.0 116.7,48.0 125.6,62.0 134.4,48.0 143.3,62.0 152.2,48.0 156.6,55.0 165.0,55.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><rect x=\"165.0\" y=\"38.0\" width=\"40.0\" height=\"34.0\" rx=\"0\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"2\" /><text x=\"185.0\" y=\"60.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">m<\/text><text x=\"60.0\" y=\"40.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">k<\/text><text x=\"130.0\" y=\"40.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">k<\/text><line x1=\"10.0\" y1=\"72.0\" x2=\"260.0\" y2=\"72.0\" stroke=\"#94a3b8\" stroke-width=\"1.2\"/><text x=\"10.0\" y=\"108.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">(b)<\/text><line x1=\"25.0\" y1=\"118.0\" x2=\"25.0\" y2=\"195.0\" stroke=\"#1e293b\" stroke-width=\"5\"/><polyline points=\"25.0,135.0 41.8,135.0 48.4,142.0 61.8,128.0 75.0,142.0 88.3,128.0 101.6,142.0 114.9,128.0 128.2,142.0 141.6,128.0 148.2,135.0 165.0,135.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><polyline points=\"25.0,176.0 41.8,176.0 48.4,183.0 61.8,169.0 75.0,183.0 88.3,169.0 101.6,183.0 114.9,169.0 128.2,183.0 141.6,169.0 148.2,176.0 165.0,176.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><rect x=\"165.0\" y=\"122.0\" width=\"40.0\" height=\"68.0\" rx=\"0\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"2\" /><text x=\"185.0\" y=\"160.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">m<\/text><text x=\"95.0\" y=\"124.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">k<\/text><text x=\"95.0\" y=\"166.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">k<\/text><line x1=\"10.0\" y1=\"195.0\" x2=\"260.0\" y2=\"195.0\" stroke=\"#94a3b8\" stroke-width=\"1.2\"/><\/svg>", "o": ["2 : 1", "4 : 1", "√2 : 1", "1 : 2"], "s": "Series: k_eq = k/2, T₁ = 2π√(2m/k). Parallel: k_eq = 2k, T₂ = 2π√(m/2k). T₁/T₂ = √(2m/k × 2k/m) = √4 = <b>2 : 1<\/b>.", "a": 0, "sub": "Physics"}, {"ch": "Waves", "d": "M", "q": "A source S emitting sound of frequency 640 Hz moves with speed 20 m/s towards a stationary observer O (figure). If the speed of sound is 340 m/s, the frequency heard by the observer is:", "f": "<svg viewBox=\"0 0 390 205\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><circle cx=\"120.0\" cy=\"90.0\" r=\"14\" fill=\"none\" stroke=\"#a5b4fc\" stroke-width=\"1.2\"/><circle cx=\"110.0\" cy=\"90.0\" r=\"28\" fill=\"none\" stroke=\"#a5b4fc\" stroke-width=\"1.2\"/><circle cx=\"100.0\" cy=\"90.0\" r=\"42\" fill=\"none\" stroke=\"#a5b4fc\" stroke-width=\"1.2\"/><circle cx=\"90.0\" cy=\"90.0\" r=\"56\" fill=\"none\" stroke=\"#a5b4fc\" stroke-width=\"1.2\"/><circle cx=\"130.0\" cy=\"90.0\" r=\"7\" fill=\"#fde68a\" stroke=\"#f59e0b\" stroke-width=\"2\"/><text x=\"130.0\" y=\"60.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">S<\/text><line x1=\"145.0\" y1=\"90.0\" x2=\"210.0\" y2=\"90.0\" stroke=\"#e11d48\" stroke-width=\"2.4\" marker-end=\"url(#arr)\"/><text x=\"178.0\" y=\"82.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">20 m/s<\/text><text x=\"160.0\" y=\"195.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">f₀ = 640 Hz,  v_sound = 340 m/s<\/text><circle cx=\"340.0\" cy=\"62.0\" r=\"8\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"340.0\" y1=\"70.0\" x2=\"340.0\" y2=\"105.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"340.0\" y1=\"80.0\" x2=\"326.0\" y2=\"98.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"340.0\" y1=\"80.0\" x2=\"354.0\" y2=\"98.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"340.0\" y1=\"105.0\" x2=\"328.0\" y2=\"130.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"340.0\" y1=\"105.0\" x2=\"352.0\" y2=\"130.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><text x=\"340.0\" y=\"150.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">O (at rest)<\/text><\/svg>", "o": ["680 Hz", "604 Hz", "640 Hz", "720 Hz"], "s": "f' = f₀ v/(v − v_s) = 640 × 340/(340 − 20) = 640 × 340/320 = <b>680 Hz<\/b> (waves are compressed in front of the moving source).", "a": 0, "sub": "Physics"}, {"ch": "Electrostatics", "d": "E", "q": "A point charge q is placed at the centre of a cube (figure). The electric flux through one face of the cube is:", "f": "<svg viewBox=\"0 0 340 215\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><rect x=\"100.0\" y=\"80.0\" width=\"100.0\" height=\"100.0\" rx=\"0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2\" /><rect x=\"140.0\" y=\"40.0\" width=\"100.0\" height=\"100.0\" rx=\"0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2\" /><line x1=\"100.0\" y1=\"80.0\" x2=\"140.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"200.0\" y1=\"80.0\" x2=\"240.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"100.0\" y1=\"180.0\" x2=\"140.0\" y2=\"140.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"200.0\" y1=\"180.0\" x2=\"240.0\" y2=\"140.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><circle cx=\"170.0\" cy=\"110.0\" r=\"7\" fill=\"#fecdd3\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"170.0\" y=\"128.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\"><\/text><text x=\"195.0\" y=\"106.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\" font-style=\"italic\">q<\/text><text x=\"170.0\" y=\"200.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">point charge q at the centre of a cube<\/text><\/svg>", "o": ["q/3ε₀", "q/8ε₀", "q/6ε₀", "q/ε₀"], "s": "Total flux = q/ε₀ (Gauss’s law). By symmetry it is shared equally among 6 faces: φ = <b>q/6ε₀<\/b>.", "a": 2, "sub": "Physics"}, {"ch": "Moving Charges & Magnetism", "d": "M", "q": "A proton and an α-particle having the same kinetic energy enter a region of uniform magnetic field perpendicular to their velocities (figure). The ratio of the radii of their circular paths, r_p : r_α, is:", "f": "<svg viewBox=\"0 0 370 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><text x=\"130.0\" y=\"34.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"130.0\" y=\"74.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"130.0\" y=\"114.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"130.0\" y=\"154.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"170.0\" y=\"34.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"170.0\" y=\"74.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"170.0\" y=\"114.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"170.0\" y=\"154.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"210.0\" y=\"34.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"210.0\" y=\"74.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"210.0\" y=\"114.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"210.0\" y=\"154.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"250.0\" y=\"34.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"250.0\" y=\"74.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"250.0\" y=\"114.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"250.0\" y=\"154.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"290.0\" y=\"34.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"290.0\" y=\"74.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"290.0\" y=\"114.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"290.0\" y=\"154.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"330.0\" y=\"34.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"16\">×<\/text><text x=\"330.0\" y=\"  y2=\"200.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"184.0\" y1=\"186.0\" x2=\"184.0\" y2=\"214.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"196.0\" y1=\"192.0\" x2=\"196.0\" y2=\"208.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><text x=\"212.0\" y=\"218.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\"><\/text><\/svg>", "o": ["4 Ω", "9 Ω", "6 Ω", "2.67 Ω"], "s": "R/S = l/(100 − l) = 40/60, so S = R × 60/40 = 4 × 1.5 = <b>6 Ω<\/b>.", "a": 2, "sub": "Physics"}, {"ch": "Wave Optics", "d": "M", "q": "Unpolarised light is incident on a glass plate of refractive index √3 at the polarising angle (Brewster’s angle) as shown, so that the reflected light is completely plane-polarised. The angle of incidence θ is:", "f": "<svg viewBox=\"0 0 360 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><rect x=\"30.0\" y=\"110.0\" width=\"300.0\" height=\"80.0\" rx=\"0\" fill=\"#dbeafe\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"30.0\" y1=\"110.0\" x2=\"330.0\" y2=\"110.0\" stroke=\"#1e293b\" stroke-width=\"2.6\"/><line x1=\"180.0\" y1=\"40.0\" x2=\"180.0\" y2=\"180.0\" stroke=\"#94a3b8\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/><line x1=\"102.0\" y1=\"65.0\" x2=\"180.0\" y2=\"110.0\" stroke=\"#e11d48\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/><line x1=\"180.0\" y1=\"110.0\" x2=\"258.0\" y2=\"65.0\" stroke=\"#e11d48\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/><line x1=\"180.0\" y1=\"110.0\" x2=\"220.0\" y2=\"179.0\" stroke=\"#4f46e5\" stroke-width=\"2.2\" marker-end=\"url(#arb)\"/><text x=\"142.0\" y=\"62.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"11\">incident<\/text><text x=\"262.0\" y=\"58.0\" text-anchor=\"start\" fill=\"#e11d48\" font-size=\"11\">reflected<\/text><text x=\"232.0\" y=\"176.0\" text-anchor=\"start\" fill=\"#4f46e5\" font-size=\"11\">refracted<\/text><text x=\"300.0\" y=\"140.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\ <script>
(function(){
var T=window.TEST,Q=T.questions,N=Q.length,LS='vca_'+T.id,st=null,tick=null,L='ABCD';
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){try{var s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function has(i){var a=st.ans[i];return typeof a==='string'?a!=='':a>=0}
function isOk(i){var q=Q[i],a=st.ans[i];if(!has(i))return false;if(q.t==='n'){var v=parseFloat(a);return !isNaN(v)&&Math.abs(v-q.a)<=(q.tol||0.011)}return a===q.a}
function mmss(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return(m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function show(id){['start','exam','res'].forEach(function(k){$(k).classList.toggle('hide',k!==id)});window.scrollTo(0,0)}
function modal(t,b,btns){$('mt').textContent=t;$('mb').innerHTML=b;var r=$('mr');r.innerHTML='';btns.forEach(function(x){var e=document.createElement('button');e.className='btn sm '+(x.c||'');e.textContent=x.t;e.onclick=function(){$('modal').classList.remove('on');x.f&&x.f()};r.appendChild(e)});$('modal').classList.add('on')}

/* ---------- start screen ---------- */
document.title=T.title+' | VCA EduTech & AI';
$('ttl').textContent=T.title;$('badge').textContent=T.badge;$('h1').textContent=T.title;$('sub').innerHTML=T.subtitle;
$('stats').innerHTML=T.stats.map(function(s){return'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join('');
$('rules').innerHTML=T.rules.map(function(r){return'<li>'+r+'</li>'}).join('');
var old=load();if(old&&!old.done){$('resume').classList.remove('hide');$('nm').value=old.name||''}
if(old&&old.done){$('resume').classList.remove('hide');$('resume').textContent='See my last result'}
$('go').onclick=function(){var n=$('nm').value.trim();if(!n){$('nm').focus();$('nm').style.borderColor='#dc2626';return}
 var seed=Math.floor(Math.random()*1e9),r=rng(seed),perm=Q.map(function(){var p=[0,1,2,3];for(var i=3;i>0;i--){var j=Math.floor(r()*(i+1)),t=p[i];p[i]=p[j];p[j]=t}return p});
 st={name:n,seed:seed,perm:perm,start:Date.now(),end:Date.now()+T.minutes*60000,cur:0,ans:Q.map(function(){return-1}),stat:Q.map(function(){return 0}),spent:Q.map(function(){return 0}),done:false};
 st.stat[0]=1;save();begin()};
$('resume').onclick=function(){st=old;if(st.done){result()}else{begin()}};
$('nm').oninput=function(){this.style.borderColor=''};

/* ---------- exam ---------- */
var lastT=0;
function begin(){show('exam');$('timer').classList.remove('hide');$('cand').textContent='Candidate: '+st.name;lastT=Date.now();buildTabs();draw();clearInterval(tick);tick=setInterval(clock,1000);clock()}
function clock(){var left=Math.round((st.end-Date.now())/1000);$('timer').textContent=mmss(left);$('timer').classList.toggle('low',left<300);if(left<=0){clearInterval(tick);finish(true)}}
function subjects(){var o=[],s={};Q.forEach(function(q,i){var k=q.sub||T.subject;if(!s[k]){s[k]=1;o.push({n:k,first:i})}});return o}
function buildTabs(){var S=subjects();$('tabs').innerHTML='';if(S.length<2){$('tabs').classList.add('hide');return}$('tabs').classList.remove('hide');S.forEach(function(s){var b=document.createElement('button');b.className='tab';b.textContent=s.n;b.dataset.f=s.first;b.onclick=function(){go(s.first)};$('tabs').appendChild(b)})}
function spend(){var n=Date.now();st.spent[st.cur]+=Math.round((n-lastT)/1000);lastT=n}
function go(i){if(i<0||i>=N)return;spend();st.cur=i;if(st.stat[i]===0)st.stat[i]=1;save();draw();$('pal').classList.remove('open');window.scrollTo(0,0)}
function draw(){
 var i=st.cur,q=Q[i],perm=st.perm[i];
 var S=subjects(),mine=q.sub||T.subject;[].forEach.call($('tabs').children,function(b){b.classList.toggle('on',b.textContent===mine)});
 var dm={E:'Easy',M:'Medium',H:'Hard'};
 $('qh').innerHTML='<span class="qn">Q'+(i+1)+'</span><span>of '+N+'</span><span class="tag">'+esc(q.ch)+'</span><span class="tag '+q.d+'">'+dm[q.d]+'</span>'+(q.t==='n'?'<span class="tag" style="background:#fae8ff;color:#86198f">Numerical</span>':'')+'<span class="mk"><i>+'+T.pos+'</i> / <u>'+(q.t==='n'?(T.negN===undefined?T.neg:T.negN):T.neg)+'</u></span>';
 $('qt').innerHTML=q.q;
 if(q.f){$('fig').innerHTML=q.f;$('fig').classList.remove('hide')}else{$('fig').classList.add('hide');$('fig').innerHTML=''}
 $('opts').innerHTML='';
 if(q.t==='n'){var w=document.createElement('div');w.innerHTML='<div style="font-size:14px;color:#64748b;margin-bottom:6px">Type your answer (a number; round to 2 decimal places if needed)</div><input id="num" class="inp" inputmode="decimal" autocomplete="off" placeholder="Enter numerical value" style="max-width:280px;font-size:20px;font-weight:700">';$('opts').appendChild(w);var inp=w.querySelector('input');inp.value=has(i)?st.ans[i]:'';inp.oninput=function(){var v=inp.value.trim();st.ans[i]=/^-?\d*\.?\d*$/.test(v)&&v!==''&&v!=='-'&&v!=='.'?v:-1;save();pal()}}
 else perm.forEach(function(orig,k){var b=document.createElement('button');b.className='opt'+(st.ans[i]===orig?' sel':'');b.innerHTML='<span class="k">'+L[k]+'</span><span>'+q.o[orig]+'</span>';b.onclick=function(){st.ans[i]=(st.ans[i]===orig?-1:orig);save();draw()};$('opts').appendChild(b)});
 $('prev').disabled=i===0;$('next').textContent=i===N-1?'Save':'Save & next →';
 pal();
}
function pal(){var g=$('grid');g.innerHTML='';var c=[0,0,0,0,0];
 for(var i=0;i<N;i++){var s=st.stat[i];if(s===0&&i===st.cur)s=1;c[s]++;var b=document.createElement('button');b.className='pb s'+s+(i===st.cur?' cur':'');b.textContent=i+1;(function(i){b.onclick=function(){go(i)}})(i);g.appendChild(b)}
 $('cnt').innerHTML='Answered: <b>'+(c[2]+c[4])+'</b> · Not answered: <b>'+c[1]+'</b> · Marked: <b>'+(c[3]+c[4])+'</b> · Not visited: <b>'+c[0]+'</b>'}
function setStat(i,marked){var a=has(i);st.stat[i]=marked?(a?4:3):(a?2:1)}
$('next').onclick=function(){setStat(st.cur,false);save();if(st.cur<N-1)go(st.cur+1);else draw()};
$('mark').onclick=function(){setStat(st.cur,true);save();if(st.cur<N-1)go(st.cur+1);else draw()};
$('clr').onclick=function(){st.ans[st.cur]=-1;setStat(st.cur,st.stat[st.cur]>=3);save();draw()};
$('prev').onclick=function(){go(st.cur-1)};
$('palbtn').onclick=function(){$('pal').classList.toggle('open')};
$('sub1').onclick=function(){var a=Q.filter(function(q,i){return has(i)}).length;modal('Submit the test?','You have answered <b>'+a+'</b> of <b>'+N+'</b> questions. <b>'+(N-a)+'</b> are unattempted. Once submitted you cannot change answers.',[{t:'Keep going',c:'ghost'},{t:'Submit now',f:function(){finish(false)}}])};
document.addEventListener('keydown',function(e){if(e.target&&e.target.tagName==='INPUT')return;if($('exam').classList.contains('hide')||$('modal').classList.contains('on'))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(Q[st.cur].t==='n')return;var k='1234'.indexOf(e.key);if(k<0)k='abcd'.indexOf(e.key.toLowerCase());if(k>=0){var o=st.perm[st.cur][k];st.ans[st.cur]=(st.ans[st.cur]===o?-1:o);save();draw()}});

/* ---------- result ---------- */
function finish(auto){spend();clearInterval(tick);st.done=true;st.endedAt=Date.now();save();$('timer').classList.add('hide');result(auto)}
function calc(){var r={c:0,w:0,u:0,sc:0,by:{}};Q.forEach(function(q,i){var k=q.sub||T.subject;r.by[k]=r.by[k]||{c:0,w:0,u:0,sc:0,n:0};var b=r.by[k];b.n++;var ng=q.t==='n'?(T.negN===undefined?T.neg:T.negN):T.neg;if(!has(i)){r.u++;b.u++}else if(isOk(i)){r.c++;b.c++;r.sc+=T.pos;b.sc+=T.pos}else{r.w++;b.w++;r.sc+=ng;b.sc+=ng}});return r}
function result(auto){
 show('res');var r=calc(),max=N*T.pos,pct=Math.max(0,Math.round(r.sc/max*100)),att=r.c+r.w,acc=att?Math.round(r.c/att*100):0,tm=Math.round(((st.endedAt||Date.now())-st.start)/1000);
 var col=pct>=70?'#16a34a':pct>=40?'#f59e0b':'#ef4444';
 var msg=pct>=70?'Outstanding! You are performing at a high level. Now prove it in more full tests.':pct>=40?'Good base. A few weak chapters are holding your score back — see the analysis below and fix them.':'This test just showed you exactly where to improve. Every topper starts with an honest score. Review the solutions below.';
