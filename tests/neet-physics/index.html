<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--p1:#4f46e5;--p2:#7c3aed;--hot:#f97316;--hot2:#ef4444;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.top{background:linear-gradient(110deg,#312e81,#6d28d9 55%,#db2777);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0003}
.brand{font-weight:800;letter-spacing:.2px;font-size:15px;line-height:1.15}.brand small{display:block;font-weight:500;opacity:.85;font-size:11px}
.ttl{flex:1;font-size:13px;opacity:.95;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{background:#0f172a99;border:1px solid #ffffff55;border-radius:10px;padding:5px 12px;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;min-width:84px;text-align:center}
.timer.low{background:var(--hot2);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.65}}
.wrap{max-width:1120px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px #0f172a14,0 8px 24px #0f172a0a;padding:18px}
/* start */
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#db2777);color:#fff;border-radius:20px;padding:26px 22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:#ffffff1f}
.hero h1{margin:6px 0 8px;font-size:clamp(24px,5vw,38px);line-height:1.15}
.pill{display:inline-block;background:#fde047;color:#422006;font-weight:800;font-size:12px;border-radius:999px;padding:4px 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:#ffffff26;border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;opacity:.9}
.rules{margin:14px 0 0;padding-left:18px;color:#334155;font-size:14px}.rules li{margin:5px 0}
.inp{width:100%;font:inherit;padding:13px 14px;border:2px solid var(--line);border-radius:12px;margin:8px 0 12px;font-size:16px}.inp:focus{outline:none;border-color:var(--p1)}
.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(90deg,var(--hot),var(--hot2));box-shadow:0 6px 16px #ef444455}
.btn.alt{background:linear-gradient(90deg,var(--p1),var(--p2));box-shadow:0 6px 16px #4f46e555}
.btn.ghost{background:#fff;color:var(--p1);border:2px solid var(--p1);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:14px;box-shadow:none}
.btn:active{transform:translateY(1px)}
/* exam */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;font-size:14px;color:#334155}
.tab.on{background:var(--p1);border-color:var(--p1);color:#fff}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:10px}
.qn{background:var(--p1);color:#fff;border-radius:8px;padding:3px 11px;font-weight:800;font-size:14px}
.tag{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#eef2ff;color:#4338ca}.tag.E{background:#dcfce7;color:#166534}.tag.M{background:#fef9c3;color:#854d0e}.tag.H{background:#fee2e2;color:#991b1b}
.mk{margin-left:auto;font-weight:700;color:#334155}.mk i{font-style:normal;color:var(--ok)}.mk u{text-decoration:none;color:var(--bad)}
.qt{font-size:17px;line-height:1.6;margin:6px 0 10px}
.fig{background:linear-gradient(#fff,#f8fafc);border:1px solid var(--line);border-radius:14px;padding:8px;margin:8px 0 14px;text-align:center}
.fig svg{width:100%;max-width:470px;height:auto;display:inline-block}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.45;color:var(--ink);transition:.12s}
.opt:hover{border-color:#a5b4fc;background:#f5f3ff}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;font-weight:800;font-size:13px;color:#475569}
.opt.sel{border-color:var(--p1);background:#eef2ff;box-shadow:0 0 0 3px #4f46e522}.opt.sel .k{background:var(--p1);border-color:var(--p1);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.bar .sp{flex:1}
.pal{position:sticky;top:64px}
.pal h3{margin:0 0 4px;font-size:15px}.cand{font-size:12px;color:var(--mut);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:46vh;overflow:auto;padding:2px}
.pb{height:40px;border:0;border-radius:8px;font-weight:800;font-size:14px;background:#e2e8f0;color:#334155;position:relative}
.pb.s1{background:#ef4444;color:#fff;border-radius:8px 8px 18px 18px}.pb.s2{background:#22c55e;color:#fff;border-radius:18px 18px 8px 8px}.pb.s3{background:#8b5cf6;color:#fff;border-radius:50%}.pb.s4{background:#8b5cf6;color:#fff;border-radius:50%}
.pb.s4:after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.pb.cur{outline:3px solid var(--hot);outline-offset:1px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:11px;color:#475569;margin:10px 0}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.palbtn{display:none}
/* modal */
.modal{position:fixed;inset:0;background:#0f172a99;display:none;place-items:center;z-index:50;padding:16px}.modal.on{display:grid}
.mbox{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%}.mbox h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* result */
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e2e8f0 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}.ring b{font-size:30px;line-height:1}.ring span{font-size:12px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--mut)}
.subrow{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:14px;font-weight:700}
.meter{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}.meter div{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--p1),#ec4899)}
.cta{background:linear-gradient(135deg,#0f172a,#312e81);color:#fff;border-radius:18px;padding:20px;margin-top:14px}.cta h3{margin:0 0 6px;font-size:22px}.cta p{margin:6px 0;opacity:.92}
.cta .price{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.cta .price div{background:#ffffff1f;border-radius:12px;padding:10px 14px}.cta .price b{font-size:22px;color:#fde047}.cta .price s{opacity:.7}
.rv{border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:#fff}.rv.ok{border-left:6px solid var(--ok)}.rv.no{border-left:6px solid var(--bad)}.rv.sk{border-left:6px solid var(--warn)}
.rv .o{padding:8px 12px;border-radius:10px;margin:6px 0;border:1px solid var(--line);font-size:15px}.rv .o.c{background:#dcfce7;border-color:#86efac}.rv .o.w{background:#fee2e2;border-color:#fca5a5}
.sol{background:#f8fafc;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.hide{display:none!important}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:20px 10px 40px}
@media(max-width:900px){
 .exam{grid-template-columns:1fr}
 .pal{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;border-radius:18px 18px 0 0;transform:translateY(105%);transition:.25s;box-shadow:0 -10px 30px #0004;max-height:78vh;overflow:auto}
 .pal.open{transform:none}
 .palbtn{display:block;position:fixed;right:12px;bottom:12px;z-index:25;border-radius:999px;padding:12px 18px}
 .stats{grid-template-columns:repeat(2,1fr)}.score{grid-template-columns:1fr;justify-items:center;text-align:center}.kpis{grid-template-columns:repeat(2,1fr)}
 .ttl{display:none}.wrap{padding:10px}.card{padding:14px}.bar{padding-bottom:64px}
}
</style>
</head>

te works like the real NTA screen.", "Options are shuffled for every student, so copying answers will not help.", "The timer starts when you press Start. The test auto-submits when time ends. Your attempt is saved on this device if you refresh."], "questions": [{"ch": "Kinematics", "d": "E", "q": "The velocity–time graph of a particle moving on a straight line is shown. The distance travelled by the particle in the first 14 s is:", "f": "<svg viewBox=\"0 0 380 195\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"50.0\" y1=\"165.0\" x2=\"358.0\" y2=\"165.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"165.0\" x2=\"50.0\" y2=\"17.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"358.0\" y=\"157.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">t (s)<\/text><text x=\"56.0\" y=\"21.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">v (m/s)<\/text><line x1=\"127.3\" y1=\"162.0\" x2=\"127.3\" y2=\"168.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"127.3\" y=\"179.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">4<\/text><line x1=\"243.3\" y1=\"162.0\" x2=\"243.3\" y2=\"168.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"243.3\" y=\"179.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">10<\/text><line x1=\"320.7\" y1=\"162.0\" x2=\"320.7\" y2=\"168.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"320.7\" y=\"179.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">14<\/text><line x1=\"47.0\" y1=\"61.0\" x2=\"53.0\" y2=\"61.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"44.0\" y=\"65.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">20<\/text><polyline points=\"50.0,165.0 127.3,61.0 243.3,61.0 320.7,165.0\" fill=\"#e0e7ff\" stroke=\"#4f46e5\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><line x1=\"127.3\" y1=\"61.0\" x2=\"127.3\" y2=\"165.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"127.3\" y1=\"61.0\" x2=\"50.0\" y2=\"61.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"243.3\" y1=\"61.0\" x2=\"243.3\" y2=\"165.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"243.3\" y1=\"61.0\" x2=\"50.0\" y2=\"61.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><\/svg>", "o": ["220 m", "160 m", "200 m", "180 m"], "s": "Distance = area under the v–t graph = ½×4×20 + 6×20 + ½×4×20 = 40 + 120 + 40 = <b>200 m<\/b>.", "a": 2, "sub": "Physics"}, {"ch": "Projectile Motion", "d": "E", "q": "Two projectiles are launched from the same point with the same speed, one at 30° and the other at 60° to the horizontal, as shown. The ratio of their horizontal ranges is:", "f": "<svg viewBox=\"0 0 400 205\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"20.0\" y1=\"170.0\" x2=\"380.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><path d=\"M40 170 Q190 -50 340 170\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.2\"/><path d=\"M40 170 Q190 96 340 170\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"2.2\"/><line x1=\"40.0\" y1=\"170.0\" x2=\"65.0\" y2=\"127.0\" stroke=\"#4f46e5\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><line x1=\"40.0\" y1=\"170.0\" x2=\"83.0\" y2=\"145.0\" stroke=\"#e11d48\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/><text x=\"80.0\" y=\"128.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">60°<\/text><text x=\"98.0\" y=\"158.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">30°<\/text><circle cx=\"40.0\" cy=\"170.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"340.0\" cy=\"170.0\" r=\"3\" fill=\"#1e293b\"/><text x=\"190.0\" y=\"195.0\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">same speed u, same launch point<\/text><\/svg>", "o": ["1 : 3", "3 : 1", "√3 : 1", "1 : 1"], "s": "R = u² sin 2θ / g. sin 60° = sin 120°, so sin(2×30°) = sin(2×60°). Both ranges are equal: <b>1 : 1<\/b>.", "a": 3, "sub": "Physics"}, {"ch": "Laws of Motion", "d": "M", "q": "A block slides down a rough inclined plane of angle 30° with coefficient of friction μ = 1/(2√3), as shown. Taking g = 10 m/s², its acceleration is:", "f": "<svg viewBox=\"0 0 340 205\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><polyline points=\"40.0,170.0 300.0,170.0 300.0,20.0 40.0,170.0\" fill=\"#f1f5f9\" stroke=\"#1e293b\" stroke-width=\"2\" stroke-linejoin=\"round\"/><g transform=\"rotate(-30 170 95)\"><rect x=\"148.0\" y=\"51.0\" width=\"44.0\" height=\"44.0\" rx=\"0\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"2\" /><text x=\"170.0\" y=\"78.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"14\" font-weight=\"700\">m<\/text><\/g><text x=\"88.0\" y=\"163.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">30°<\/text><rect x=\"288.0\" y=\"158.0\" width=\"12.0\" height=\"12.0\" rx=\"0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"1.2\" /><text x=\"170.0\" y=\"195.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">μ = 1/(2√3)<\/text><\/svg>", "o": ["1.5 m/s²", "2.5 m/s²", "5.0 m/s²", "3.5 m/s²"], "s": "a = g(sin θ − μ cos θ) = 10[½ − (1/(2√3))(√3/2)] = 10[½ − ¼] = <b>2.5 m/s²<\/b>.", "a": 1, "sub": "Physics"}, {"ch": "Laws of Motion", "d": "M", "q": "Two masses of 2 kg and 6 kg are connected by a light string passing over a smooth, light pulley as shown. Taking g = 10 m/s², the tension in the string is:", "f": "<svg viewBox=\"0 0 400 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"165.0\" y1=\"10.0\" x2=\"235.0\" y2=\"10.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><line x1=\"200.0\" y1=\"10.0\" x2=\"200.0\" y2=\"28.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><circle cx=\"200.0\" cy=\"50.0\" r=\"22\" fill=\"#f1f5f9\" stroke=\"#1e293b\" stroke-width=\"2\"/><circle cx=\"200.0\" cy=\"50.0\" r=\"3\" fill=\"#1e293b\"/><line x1=\"178.0\" y1=\"50.0\" x2=\"178.0\" y2=\"125.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"222.0\" y1=\"50.0\" x2=\"222.0\" y2=\"125.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><rect x=\"155.0\" y=\"125.0\" width=\"46.0\" height=\"38.0\" rx=\"0\" fill=\"#bfdbfe\" stroke=\"#4f46e5\" stroke-width=\"2\" /><text x=\"178.0\" y=\"149.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">2 kg<\/text><rect x=\"199.0\" y=\"125.0\" width=\"46.0\" height=\"38.0\" rx=\"0\" fill=\"#fecdd3\" stroke=\"#e11d48\" stroke-width=\"2\" /><text x=\"222.0\" y=\"149.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">6 kg<\/text><\/svg>", "o": ["60 N", "40 N", "30 N", "20 N"], "s": "a = (6−2)g/(6+2) = 5 m/s². For the 2 kg mass: T = 2(g + a) = 2(15) = <b>30 N<\/b> (equivalently T = 2m₁m₂g/(m₁+m₂)).", "a": 2, "sub": "Physics"}, {"ch": "Work, Energy & Power", "d": "E", "q": "A variable force acts on a body along a straight line as shown in the force–displacement graph. The work done by the force from x = 0 to x = 8 m is:", "f": "<svg viewBox=\"0 0 390 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"50.0\" y1=\"160.0\" x2=\"368.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"160.0\" x2=\"50.0\" y2=\"22.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"368.0\" y=\"152.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">x (m)<\/text><text x=\"56.0\" y=\"26.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">F (N)<\/text><line x1=\"116.7\" y1=\"157.0\" x2=\"116.7\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"116.7\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">2<\/text><line x1=\"250.0\" y1=\"157.0\" x2=\"250.0\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"250.0\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">6<\/text><line x1=\"316.7\" y1=\"157.0\" x2=\"316.7\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"316.7\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">8<\/text><line x1=\"47.0\" y1=\"60.0\" x2=\"53.0\" y2=\"60.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"44.0\" y=\"64.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">10<\/text><polyline points=\"50.0,160.0 116.7,60.0 250.0,60.0 316.7,160.0\" fill=\"#ffe4e6\" stroke=\"#e11d48\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><line x1=\"116.7\" y1=\"60.0\" x2=\"116.7\" y2=\"160.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"116.7\" y1=\"60.0\" x2=\"50.0\" y2=\"60.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"250.0\" y1=\"60.0\" x2=\"250.0\" y2=\"160.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"250.0\" y1=\"60.0\" x2=\"50.0\" y2=\"60.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><\/svg>", "o": ["50 J", "60 J", "40 J", "70 J"], "s": "W = area under the F–x graph = ½×2×10 + 4×10 + ½×2×10 = 10 + 40 + 10 = <b>60 J<\/b>.", "a": 1, "sub": "Physics"}, {"ch": "Circular Motion", "d": "M", "q": "A particle of mass 0.5 kg is whirled in a vertical circle with a light string and just completes the circle. The difference between the tension at the lowest point B and at the highest point A is (g = 10 m/s²):", "f": "<svg viewBox=\"0 0 340 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><circle cx=\"150.0\" cy=\"100.0\" r=\"62\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line x1=\"150.0\" y1=\"100.0\" x2=\"150.0\" y2=\"162.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"150.0\" y1=\"100.0\" x2=\"150.0\" y2=\"38.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><circle cx=\"150.0\" cy=\"100.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"150.0\" cy=\"162.0\" r=\"9\" fill=\"#fecdd3\" stroke=\"#e11d48\" stroke-width=\"2\"/><circle cx=\"150.0\" cy=\"38.0\" r=\"9\" fill=\"#fecdd3\" stroke=\"#e11d48\" stroke-width=\"2\"/><text x=\"150.0\" y=\"191.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">B (lowest point)<\/text><text x=\"150.0\" y=\"19.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">A (highest point)<\/text><text x=\"160.0\" y=\"95.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\">O<\/text><text x=\"158.0\" y=\"135.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">R<\/text><text x=\"215.0\" y=\"105.0\" text-anchor=\"start\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">m = 0.5 kg<\/text><\/svg>", "o": ["45 N", "60 N", "30 N", "15 N"], "s": "Just completing the circle: T_A = 0, v_A² = gR. v_B² = 5gR so T_B = mg + mv_B²/R = 6mg. Difference = 6mg = 6×0.5×10 = <b>30 N<\/b>.", "a": 2, "sub": "Physics"}, {"ch": "Rotational Motion", "d": "M", "q": "A uniform thin rod of mass M and length L rotates about an axis perpendicular to the rod, passing through a point at distance L/4 from one end (figure). Its moment of inertia is:", "f": "<svg viewBox=\"0 0 340 185\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><rect x=\"40.0\" y=\"85.0\" width=\"260.0\" height=\"16.0\" rx=\"0\" fill=\"#c7d2fe\" stroke=\"#4f46e5\" stroke-width=\"2\" /><line x1=\"105.0\" y1=\"52.0\" x2=\"105.0\" y2=\"135.0\" stroke=\"#e11d48\" stroke-width=\"2\" stroke-dasharray=\"6 3\"/><text x=\"105.0\" y=\"46.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">axis ⟂ to rod<\/text><circle cx=\"170.0\" cy=\"93.0\" r=\"3\" fill=\"#1e293b\"/><text x=\"170.0\" y=\"78.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">C<\/text><line x1=\"40.0\" y1=\"120.0\" x2=\"105.0\" y2=\"120.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"72.0\" y=\"137.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">L/4<\/text><line x1=\"40.0\" y1=\"155.0\" x2=\"300.0\" y2=\"155.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"170.0\" y=\"172.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">L (mass M)<\/text><\/svg>", "o": ["ML²/12", "5ML²/48", "ML²/3", "7ML²/48"], "s": "I = I_cm + Md² with d = L/2 − L/4 = L/4: I = ML²/12 + M(L/4)² = ML²(4+3)/48 = <b>7ML²/48<\/b>.", "a": 3, "sub": "Physics"}, {"ch": "Gravitation", "d": "M", "q": "A satellite S revolves around the Earth (radius R) at a height h = 3R above the surface as shown. The ratio of its orbital speed to the orbital speed of a satellite grazing the Earth’s surface is:", "f": "<svg viewBox=\"0 0 340 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><circle cx=\"150.0\" cy=\"105.0\" r=\"88\" fill=\"none\" stroke=\"#94a3b8\" stroke-width=\"1.5\" stroke-dasharray=\"6 4\"/><circle cx=\"150.0\" cy=\"105.0\" r=\"22\" fill=\"#bae6fd\" stroke=\"#4f46e5\" stroke-width=\"2\"/><text x=\"150.0\" y=\"98.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"10\">Earth<\/text><line x1=\"150.0\" y1=\"105.0\" x2=\"238.0\" y2=\"105.0\" stroke=\"#1e293b\" stroke-width=\"1.4\"/><circle cx=\"238.0\" cy=\"105.0\" r=\"6\" fill=\"#fde68a\" stroke=\"#f59e0b\" stroke-width=\"2\"/><text x=\"238.0\" y=\"90.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">S<\/text><line x1=\"172.0\" y1=\"125.0\" x2=\"238.0\" y2=\"125.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"205.0\" y=\"141.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">h = 3R<\/text><text x=\"161.0\" y=\"121.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">R<\/text><\/svg>", "o": ["1/√3", "1/2", "1/4", "1/√2"], "s": "v = √(GM/r) ∝ 1/√r. Here r = R + 3R = 4R, so v/v₀ = √(R/4R) = <b>1/2<\/b>.", "a": 1, "sub": "Physics"}, {"ch": "Properties of Solids", "d": "M", "q": "Two wires of the same material are loaded by the same force F as shown: wire 1 has length L and radius r, wire 2 has length 2L and radius 2r. The ratio of the elongation of wire 1 to that of wire 2 is:", "f": "<svg viewBox=\"0 0 300 250\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"40.0\" y1=\"12.0\" x2=\"280.0\" y2=\"12.0\" stroke=\"#1e293b\" stroke-width=\"3\"/><rect x=\"97.0\" y=\"12.0\" width=\"6.0\" height=\"90.0\" rx=\"0\" fill=\"#4f46e5\" stroke=\"#4f46e5\" stroke-width=\"1\" /><rect x=\"194.0\" y=\"12.0\" width=\"12.0\" height=\"180.0\" rx=\"0\" fill=\"#4f46e5\" stroke=\"#4f46e5\" stroke-width=\"1\" /><line x1=\"100.0\" y1=\"102.0\" x2=\"100.0\" y2=\"140.0\" stroke=\"#e11d48\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/><text x=\"100.0\" y=\"156.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">F<\/text><line x1=\"200.0\" y1=\"192.0\" x2=\"200.0\" y2=\"228.0\" stroke=\"#e11d48\" stroke-width=\"2.2\" marker-end=\"url(#arr)\"/><text x=\"200.0\" y=\"244.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">F<\/text><text x=\"78.0\" y=\"60.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">L, r<\/text><text x=\"228.0\" y=\"100.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">2L, 2r<\/text><text x=\"84.0\" y=\"36.0\" text-anchor=\"end\" fill=\"#94a3b8\" font-size=\"11\">wire 1<\/text><text x=\"184.0\" y=\"36.0\" text-anchor=\"end\" fill=\"#94a3b8\" font-size=\"11\">wire 2<\/text><\/svg>", "o": ["1 : 2", "4 : 1", "2 : 1", "1 : 1"], "s": "Δl = FL/(πr²Y). Δl₁/Δl₂ = (L/r²)/(2L/4r²) = (L/r²)/(L/2r²) = <b>2 : 1<\/b>.", "a": 2, "sub": "Physics"}, {"ch": "Fluid Mechanics", "d": "H", "q": "A tank is filled with water to a height H = 1.0 m. A small hole is made in the side wall at a depth of 0.8 m below the free surface (figure). Taking g = 10 m/s², the horizontal distance x from the tank at which the jet strikes the ground is:", "f": "<svg viewBox=\"0 0 350 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><polyline points=\"40.0,20.0 40.0,180.0 180.0,180.0 180.0,20.0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"41.0\" y=\"30.0\" width=\"138.0\" height=\"150.0\" rx=\"0\" fill=\"#bae6fd\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"41.0\" y1=\"30.0\" x2=\"179.0\" y2=\"30.0\" stroke=\"#4f46e5\" stroke-width=\"2\"/><rect x=\"176.0\" y=\"146.0\" width=\"8.0\" height=\"8.0\" rx=\"0\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" /><path d=\"M180 150 Q240 150 300 180\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.4\"/><line x1=\"10.0\" y1=\"180.0\" x2=\"340.0\" y2=\"180.0\" stroke=\"#1e293b\" stroke-width=\"2\"/><line x1=\"24.0\" y1=\"30.0\" x2=\"24.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"50.0\" y=\"98.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">0.8 m<\/text><line x1=\"180.0\" y1=\"196.0\" x2=\"300.0\" y2=\"196.0\" stroke=\"#1e293b\" stroke-width=\"1.2\" marker-end=\"url(#ar)\" marker-start=\"url(#ar)\"/><text x=\"240.0\" y=\"212.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">x = ?<\/text><text x=\"110.0\" y=\"24.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"11\">water surface<\/text><text x=\"110.0\" y=\"120.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">H = 1.0 m<\/text><circle cx=\"180.0\" cy=\"150.0\" r=\"3\" fill=\"#e11d48\"/><\/svg>", "o": ["0.4 m", "0.6 m", "1.6 m", "0.8 m"], "s": "Exit speed v = √(2g·0.8) = 4 m/s. The hole is 0.2 m above the ground: t = √(2×0.2/10) = 0.2 s. x = vt = <b>0.8 m<\/b>.", "a": 3, "sub": "Physics"}, {"ch": "Thermal Properties", "d": "M", "q": "A solid of mass m is heated by a source of constant power. The temperature–time graph is shown. The ratio of specific heat of the liquid to that of the solid (c_liquid / c_solid) is:", "f": "<svg viewBox=\"0 0 370 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"60.0\" y1=\"100.0\" x2=\"358.0\" y2=\"100.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"60.0\" y1=\"162.0\" x2=\"60.0\" y2=\"7.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"358.0\" y=\"92.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">t (min)<\/text><text x=\"66.0\" y=\"11.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">T (°C)<\/text><line x1=\"100.0\" y1=\"97.0\" x2=\"100.0\" y2=\"103.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"100.0\" y=\"114.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">2<\/text><line x1=\"220.0\" y1=\"97.0\" x2=\"220.0\" y2=\"103.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"220.0\" y=\"114.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">8<\/text><line x1=\"300.0\" y1=\"97.0\" x2=\"300.0\" y2=\"103.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"300.0\" y=\"114.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">12<\/text><line x1=\"57.0\" y1=\"160.0\" x2=\"63.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"54.0\" y=\"164.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">-20<\/text><line x1=\"57.0\" y1=\"40.0\" x2=\"63.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"54.0\" y=\"44.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">20<\/text><polyline points=\"60.0,160.0 100.0,100.0 220.0,100.0 300.0,40.0\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><line x1=\"300.0\" y1=\"40.0\" x2=\"300.0\" y2=\"100.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"300.0\" y1=\"40.0\" x2=\"60.0\" y2=\"40.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"60.0\" y1=\"160.0\" x2=\"100.0\" y2=\"160.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"100.0\" y1=\"160.0\" x2=\"100.0\" y2=\"100.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><\/svg>", "o": ["4", "2", "1/2", "1"], "s": "Solid: P×2 = m c_s (20). Liquid (0→20 °C in 4 min): P×4 = m c_l (20). Dividing: c_l/c_s = 4/2 = <b>2<\/b>.", "a": 1, "sub": "Physics"}, {"ch": "Thermodynamics", "d": "H", "q": "A gas undergoes the cyclic process A → B → C → A shown on the P–V diagram. The net work done by the gas in one cycle is:", "f": "<svg viewBox=\"0 0 380 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"60.0\" y1=\"165.0\" x2=\"358.0\" y2=\"165.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"60.0\" y1=\"165.0\" x2=\"60.0\" y2=\"17.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"358.0\" y=\"157.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">V (L)<\/text><text x=\"66.0\" y=\"21.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">P (10⁵ Pa)<\/text><line x1=\"130.0\" y1=\"162.0\" x2=\"130.0\" y2=\"168.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"130.0\" y=\"179.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">2<\/text><line x1=\"270.0\" y1=\"162.0\" x2=\"270.0\" y2=\"168.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"270.0\" y=\"179.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">6<\/text><line x1=\"57.0\" y1=\"132.5\" x2=\"63.0\" y2=\"132.5\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"54.0\" y=\"136.5\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">1<\/text><line x1=\"57.0\" y1=\"67.5\" x2=\"63.0\" y2=\"67.5\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"54.0\" y=\"71.5\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">3<\/text><polyline points=\"130.0,132.5 270.0,132.5 270.0,67.5 130.0,132.5\" fill=\"#e0e7ff\" stroke=\"#4f46e5\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><line x1=\"196.0\" y1=\"132.5\" x2=\"204.0\" y2=\"132.5\" stroke=\"#e11d48\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><line x1=\"270.0\" y1=\"104.0\" x2=\"270.0\" y2=\"96.0\" stroke=\"#e11d48\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><line x1=\"203.6\" y1=\"98.3\" x2=\"196.4\" y2=\"101.7\" stroke=\"#e11d48\" stroke-width=\"2\" marker-end=\"url(#arr)\"/><text x=\"120.0\" y=\"148.5\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">A<\/text><text x=\"282.0\" y=\"148.5\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">B<\/text><text x=\"282.0\" y=\"63.5\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">C<\/text><line x1=\"270.0\" y1=\"67.5\" x2=\"270.0\" y2=\"165.0\" stroke=\"#cbd5e1\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"270.0\" y1=\"67.5\" x2=\"60.0\" y2=\"67.5\" stroke=\"#cbd5e1\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><\/svg>", "o": ["−800 J", "+400 J", "+800 J", "−400 J"], "s": "Area = ½ × (4×10⁻³ m³) × (2×10⁵ Pa) = 400 J. The cycle A→B→C→A is traversed <b>anticlockwise<\/b>, so the work done by the gas is <b>−400 J<\/b>.", "a": 3, "sub": "Physics"}, {"ch": "Kinetic Theory", "d": "M", "q": "The figure shows the Maxwell speed distribution of molecules of the same gas at two temperatures T₁ (curve 1) and T₂ (curve 2). Which of the following is correct?", "f": "<svg viewBox=\"0 0 350 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"40.0\" y1=\"170.0\" x2=\"330.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"40.0\" y1=\"170.0\" x2=\"40.0\" y2=\"15.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"330.0\" y=\"186.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">speed v<\/text><text x=\"48.0\" y=\"14.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"11\" font-style=\"italic\">fraction of molecules<\/text><path d=\"M40 170 C70 170 78 55 100 55 C125 55 135 150 270 168\" fill=\"none\" stroke=\"#e11d48\" stroke-width=\"2.4\"/><path d=\"M40 170 C95 170 120 100 150 100 C185 100 205 150 300 166\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.4\"/><text x=\"92.0\" y=\"48.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">curve 1<\/text><text x=\"170.0\" y=\"92.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">curve 2<\/text><\/svg>", "o": ["Cannot be decided for the same gas", "T₁ = T₂", "T₂ > T₁", "T₁ > T₂"], "s": "At higher temperature the most probable speed increases (peak shifts right) and the peak height decreases to keep the total area equal to 1. Curve 2 shows this, so <b>T₂ > T₁<\/b>.", "a": 2, "sub": "Physics"}, {"ch": "Oscillations", "d": "M", "q": "The displacement–time graph of a particle in SHM is shown. Taking π² = 10, the maximum acceleration of the particle is:", "f": "<svg viewBox=\"0 0 390 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"40.0\" y1=\"100.0\" x2=\"358.0\" y2=\"100.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"40.0\" y1=\"170.0\" x2=\"40.0\" y2=\"12 ": ["8kq/d² towards −q", "zero", "8kq/d² towards +q", "4kq/d² towards −q"], "s": "Each charge is at d/2 from M and produces kq/(d/2)² = 4kq/d² in the <i>same<\/i> direction (away from +q, towards −q). Total = <b>8kq/d² towards −q<\/b>.", "a": 0, "sub": "Physics"}, {"ch": "Capacitors", "d": "M", "q": "In the circuit shown, a 12 V battery is connected to three capacitors. The charge stored on capacitor C₃ is:", "f": "<svg viewBox=\"0 0 400 195\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"36.0\" y1=\"94.0\" x2=\"64.0\" y2=\"94.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"42.0\" y1=\"106.0\" x2=\"58.0\" y2=\"106.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><text x=\"28.0\" y=\"98.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">12 V<\/text><line x1=\"50.0\" y1=\"94.0\" x2=\"50.0\" y2=\"30.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"50.0\" y1=\"30.0\" x2=\"330.0\" y2=\"30.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"50.0\" y1=\"106.0\" x2=\"50.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"50.0\" y1=\"170.0\" x2=\"330.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"150.0\" y1=\"30.0\" x2=\"150.0\" y2=\"66.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"136.0\" y1=\"66.0\" x2=\"164.0\" y2=\"66.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"136.0\" y1=\"74.0\" x2=\"164.0\" y2=\"74.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"150.0\" y1=\"74.0\" x2=\"150.0\" y2=\"108.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"136.0\" y1=\"108.0\" x2=\"164.0\" y2=\"108.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"136.0\" y1=\"116.0\" x2=\"164.0\" y2=\"116.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"150.0\" y1=\"116.0\" x2=\"150.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"176.0\" y=\"74.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\">C₁ = 2 μF<\/text><text x=\"176.0\" y=\"116.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\">C₂ = 2 μF<\/text><line x1=\"270.0\" y1=\"30.0\" x2=\"270.0\" y2=\"96.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"256.0\" y1=\"96.0\" x2=\"284.0\" y2=\"96.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"256.0\" y1=\"104.0\" x2=\"284.0\" y2=\"104.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"270.0\" y1=\"104.0\" x2=\"270.0\" y2=\"170.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"290.0\" y=\"104.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\">C₃ = 3 μF<\/text><circle cx=\"150.0\" cy=\"30.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"270.0\" cy=\"30.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"150.0\" cy=\"170.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"270.0\" cy=\"170.0\" r=\"3\" fill=\"#1e293b\"/><\/svg>", "o": ["48 μC", "36 μC", "12 μC", "24 μC"], "s": "C₃ is directly across the battery (parallel branch), so V₃ = 12 V and Q₃ = C₃V = 3 μF × 12 V = <b>36 μC<\/b>. (The series pair C₁–C₂ has C = 1 μF and carries 12 μC.)", "a": 1, "sub": "Physics"}, {"ch": "Electrostatic Potential", "d": "E", "q": "In a region the electric potential varies along the x-axis as shown. The electric field in this region is:", "f": "<svg viewBox=\"0 0 380 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"55.0\" y1=\"160.0\" x2=\"353.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"55.0\" y1=\"160.0\" x2=\"55.0\" y2=\"22.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"353.0\" y=\"152.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">x (m)<\/text><text x=\"61.0\" y=\"26.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">V (volt)<\/text><line x1=\"279.0\" y1=\"157.0\" x2=\"279.0\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"279.0\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">4<\/text><line x1=\"52.0\" y1=\"64.0\" x2=\"58.0\" y2=\"64.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"49.0\" y=\"68.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">20<\/text><polyline points=\"55.0,64.0 279.0,160.0\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/><line x1=\"55.0\" y1=\"64.0\" x2=\"55.0\" y2=\"160.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"55.0\" y1=\"64.0\" x2=\"55.0\" y2=\"64.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><circle cx=\"55.0\" cy=\"64.0\" r=\"3\" fill=\"#4f46e5\"/><circle cx=\"279.0\" cy=\"160.0\" r=\"3\" fill=\"#4f46e5\"/><\/svg>", "o": ["80 V/m along −x", "5 V/m along +x", "20 V/m along +x", "5 V/m along −x"], "s": "E = −dV/dx. The slope is (0−20)/4 = −5 V/m, so E = <b>+5 V/m, i.e. along +x<\/b> (field points from high to low potential).", "a": 1, "sub": "Physics"}, {"ch": "Current Electricity", "d": "M", "q": "A 12 V battery of negligible internal resistance is connected to resistors as shown. The current through the 3 Ω resistor is:", "f": "<svg viewBox=\"0 0 390 175\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"34.0\" y1=\"86.0\" x2=\"34.0\" y2=\"114.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"46.0\" y1=\"92.0\" x2=\"46.0\" y2=\"108.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"34.0\" y1=\"86.0\" x2=\"34.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"34.0\" y1=\"40.0\" x2=\"90.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><rect x=\"94.0\" y=\"33.0\" width=\"52.0\" height=\"14.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><text x=\"120.0\" y=\"24.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">2 Ω<\/text><line x1=\"146.0\" y1=\"40.0\" x2=\"360.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"52.0\" y=\"104.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">12 V<\/text><line x1=\"46.0\" y1=\"108.0\" x2=\"46.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"46.0\" y1=\"150.0\" x2=\"360.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"240.0\" y1=\"40.0\" x2=\"240.0\" y2=\"78.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><rect x=\"233.0\" y=\"78.0\" width=\"14.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"240.0\" y1=\"112.0\" x2=\"240.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"262.0\" y=\"99.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\">3 Ω<\/text><line x1=\"320.0\" y1=\"40.0\" x2=\"320.0\" y2=\"78.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><rect x=\"313.0\" y=\"78.0\" width=\"14.0\" height=\"34.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"320.0\" y1=\"112.0\" x2=\"320.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"342.0\" y=\"99.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\">6 Ω<\/text><circle cx=\"240.0\" cy=\"40.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"320.0\" cy=\"40.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"240.0\" cy=\"150.0\" r=\"3\" fill=\"#1e293b\"/><circle cx=\"320.0\" cy=\"150.0\" r=\"3\" fill=\"#1e293b\"/><\/svg>", "o": ["4 A", "1 A", "3 A", "2 A"], "s": "3 Ω ∥ 6 Ω = 2 Ω; total R = 2 + 2 = 4 Ω; I = 12/4 = 3 A. Voltage across the parallel part = 3 × 2 = 6 V, so I₃ = 6/3 = <b>2 A<\/b>.", "a": 3, "sub": "Physics"}, {"ch": "Current Electricity", "d": "H", "q": "Two cells E₁ = 10 V (r₁ = 1 Ω) and E₂ = 4 V (r₂ = 1 Ω) are connected in opposition across a resistor R = 4 Ω as shown (the longer plate is the positive terminal). The terminal voltage of cell E₁ is:", "f": "<svg viewBox=\"0 0 390 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"60.0\" y1=\"40.0\" x2=\"120.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><rect x=\"120.0\" y=\"33.0\" width=\"90.0\" height=\"14.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><text x=\"165.0\" y=\"24.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">R = 4 Ω<\/text><line x1=\"210.0\" y1=\"40.0\" x2=\"300.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"40.0\" x2=\"60.0\" y2=\"86.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"46.0\" y1=\"86.0\" x2=\"74.0\" y2=\"86.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"52.0\" y1=\"98.0\" x2=\"68.0\" y2=\"98.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"60.0\" y1=\"98.0\" x2=\"60.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"150.0\" x2=\"300.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"300.0\" y1=\"40.0\" x2=\"300.0\" y2=\"92.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"286.0\" y1=\"104.0\" x2=\"314.0\" y2=\"104.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"292.0\" y1=\"92.0\" x2=\"308.0\" y2=\"92.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"300.0\" y1=\"104.0\" x2=\"300.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><text x=\"80.0\" y=\"96.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">E₁ = 10 V<\/text><text x=\"80.0\" y=\"112.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"11\">r₁ = 1 Ω<\/text><text x=\"284.0\" y=\"96.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">E₂ = 4 V<\/text><text x=\"284.0\" y=\"112.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">r₂ = 1 Ω<\/text><text x=\"60.0\" y=\"82.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">+<\/text><text x=\"300.0\" y=\"118.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">+<\/text><\/svg>", "o": ["9 V", "8 V", "10 V", "6 V"], "s": "Net emf = 10 − 4 = 6 V; total resistance = 1 + 1 + 4 = 6 Ω; I = 1 A. E₁ is discharging, so V₁ = E₁ − Ir₁ = 10 − 1 = <b>9 V<\/b>.", "a": 0, "sub": "Physics"}, {"ch": "Moving Charges & Magnetism", "d": "M", "q": "A rectangular coil of 50 turns, size 0.2 m × 0.1 m, carries a current of 2 A. It is placed in a uniform magnetic field B = 0.5 T with the plane of the coil parallel to the field (figure). The torque on the coil is:", "f": "<svg viewBox=\"0 0 370 185\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"20.0\" y1=\"35.0\" x2=\"70.0\" y2=\"35.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><line x1=\"300.0\" y1=\"35.0\" x2=\"350.0\" y2=\"35.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><line x1=\"20.0\" y1=\"75.0\" x2=\"70.0\" y2=\"75.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><line x1=\"300.0\" y1=\"75.0\" x2=\"350.0\" y2=\"75.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><line x1=\"20.0\" y1=\"115.0\" x2=\"70.0\" y2=\"115.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><line x1=\"300.0\" y1=\"115.0\" x2=\"350.0\" y2=\"115.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><line x1=\"20.0\" y1=\"155.0\" x2=\"70.0\" y2=\"155.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><line x1=\"300.0\" y1=\"155.0\" x2=\"350.0\" y2=\"155.0\" stroke=\"#4f46e5\" stroke-width=\"1.6\" marker-end=\"url(#arb)\"/><polyline points=\"110.0,70.0 250.0,70.0 280.0,125.0 140.0,125.0 110.0,70.0\" fill=\"#ffe4e6\" stroke=\"#e11d48\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><line x1=\"180.0\" y1=\"60.0\" x2=\"210.0\" y2=\"135.0\" stroke=\"#94a3b8\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"180.0\" y=\"148.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\">0.2 m<\/text><text x=\"274.0\" y=\"98.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\">0.1 m<\/text><text x=\"40.0\" y=\"22.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\">B = 0.5 T<\/text><text x=\"190.0\" y=\"22.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">N = 50, I = 2 A<\/text><\/svg>", "o": ["0.5 N·m", "1.0 N·m", "5.0 N·m", "2.0 N·m"], "s": "Plane parallel to B means the normal is perpendicular to B, so τ = NIAB sin 90° = 50 × 2 × (0.2×0.1) × 0.5 = <b>1.0 N·m<\/b>.", "a": 1, "sub": "Physics"}, {"ch": "Moving Charges & Magnetism", "d": "M", "q": "A long straight wire carries current I and has a semicircular arc of radius R in its path, as shown (the straight parts lie along a line through the centre O). The magnetic field at O is:", "f": "<svg viewBox=\"0 0 340 140\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"20.0\" y1=\"100.0\" x2=\"120.0\" y2=\"100.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><path d=\"M120 100 A50 50 0 0 1 220 100\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"220.0\" y1=\"100.0\" x2=\"320.0\" y2=\"100.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><circle cx=\"170.0\" cy=\"100.0\" r=\"3\" fill=\"#e11d48\"/><text x=\"170.0\" y=\"118.0\" text-anchor=\"middle\" fill=\"#e11d48\" font-size=\"12\" font-weight=\"700\">O<\/text><line x1=\"170.0\" y1=\"100.0\" x2=\"205.0\" y2=\"65.0\" stroke=\"#94a3b8\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/><text x=\"196.0\" y=\"92.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">R<\/text><line x1=\"55.0\" y1=\"100.0\" x2=\"80.0\" y2=\"100.0\" stroke=\"#4f46e5\" stroke-width=\"2.6\" marker-end=\"url(#arb)\"/><text x=\"60.0\" y=\"88.0\" text-anchor=\"middle\" fill=\"#4f46e5\" font-size=\"12\" font-weight=\"700\" font-style=\"italic\">I<\/text><\/svg>", "o": ["μ₀I/4πR", "μ₀I/2R", "μ₀I/8R", "μ₀I/4R"], "s": "The straight wires pass through O and contribute zero (dl × r = 0). A semicircle gives half of μ₀I/2R: B = <b>μ₀I/4R<\/b>.", "a": 3, "sub": "Physics"}, {"ch": "Electromagnetic Induction", "d": "M", "q": "The magnetic flux linked with a coil varies with time as shown. The ratio of the magnitude of the induced emf during 0–4 s to that during 6–8 s is:", "f": "<svg viewBox=\"0 0 390 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"50.0\" y1=\"160.0\" x2=\"358.0\" y2=\"160.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"160.0\" x2=\"50.0\" y2=\"22.0\" stroke=\"#1e293b\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"358.0\" y=\"152.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">t (s)<\/text><text x=\"56.0\" y=\"26.0\" text-anchor=\"start\" fill=\"#1e293b\" font-size=\"12\" font-style=\"italic\">φ (Wb)<\/text><line x1=\"178.9\" y1=\"157.0\" x2=\"178.9\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"178.9\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">4<\/text><line x1=\"243.3\" y1=\"157.0\" x2=\"243.3\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"243.3\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">6<\/text><line x1=\"307.8\" y1=\"157.0\" x2=\"307.8\" y2=\"163.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"307.8\" y=\"174.0\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"11\">8<\/text><line x1=\"47.0\" y1=\"60.0\" x2=\"53.0\" y2=\"60.0\" stroke=\"#1e293b\" stroke-width=\"1.2\"/><text x=\"44.0\" y=\"64.0\" text-anchor=\"end\" fill=\"#1e293b\" font-size=\"11\">10<\/text><polyline points=\"50.0,160.0 178.9,60.0 243.3,60.0 307.8,160.0\" fill=\"#d1fae5\" stroke=\"#059669\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><line x1=\"178.9\" y1=\"60.0\" x2=\"178.9\" y2=\"160.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><line x1=\"178.9\" y1=\"60.0\" x2=\"50.0\" y2=\"60.0\" stroke=\"#94a3b8\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/><\/svg>", "o": ["1 : 1", "1 : 2", "1 : 4", "2 : 1"], "s": "|ε| = |dφ/dt|. For 0–4 s: 10/4 = 2.5 V. For 6–8 s: 10/2 = 5 V. Ratio = <b>1 : 2<\/b> (and the emfs have opposite signs).", "a": 1, "sub": "Physics"}, {"ch": "Alternating Current", "d": "M", "q": "A series LCR circuit with R = 30 Ω, X_L = 60 Ω and X_C = 20 Ω is connected to a 100 V (rms) AC source (figure). The average power consumed in the circuit is:", "f": "<svg viewBox=\"0 0 380 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12\" role=\"img\"><line x1=\"60.0\" y1=\"40.0\" x2=\"120.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><rect x=\"120.0\" y=\"33.0\" width=\"40.0\" height=\"14.0\" rx=\"0\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"1.6\" /><line x1=\"160.0\" y1=\"40.0\" x2=\"190.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><path d=\"M190 40 a7.5 7.5 0 1 1 15.0 0 a7.5 7.5 0 1 1 15.0 0 a7.5 7.5 0 1 1 15.0 0 a7.5 7.5 0 1 1 15.0 0\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"1.8\"/><line x1=\"250.0\" y1=\"40.0\" x2=\"280.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"286.0\" y1=\"28.0\" x2=\"286.0\" y2=\"52.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"294.0\" y1=\"28.0\" x2=\"294.0\" y2=\"52.0\" stroke=\"#1e293b\" stroke-width=\"2.4\"/><line x1=\"294.0\" y1=\"40.0\" x2=\"330.0\" y2=\"40.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"330.0\" y1=\"40.0\" x2=\"330.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"330.0\" y1=\"150.0\" x2=\"60.0\" y2=\"150.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><line x1=\"60.0\" y1=\"40.0\" x2=\"60.0\" y2=\"78.0\" stroke=\"#1e293b\" stroke-width=\"1.6\"/><circle cx=\"60.0\" cy=\"95.0\" r=\"16\" fill=\"#fff\" stroke=\"#1e293b\" stroke-width=\"2\"/><path d=\"M52 95 q4 -9 8 0 t8 0\" fill=\"none\" stroke=\"#e11d48\" stroke-
